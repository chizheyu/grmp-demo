<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRMP Platform — SMC (staging)</title>
<style>
/* GRMP Demo — design system. Public microsite (SMC red) + console (ink) + personal pages. */
:root{
  --red:#C8102E; --red-deep:#A00C24; --red-wash:#FBEDEF;
  --ink:#23272F; --ink-2:#4A515E; --ink-3:#676E79;
  --canvas:#F6F5F2; --surface:#FFFFFF; --surface-2:#FBFAF8;
  --line:#E8E5DF; --line-2:#F1EFEA; --cream:#F5ECE0;
  --ai:#6D5CF0; --ai-ink:#5B45E0; --ai-wash:#F4F1FF; --ai-line:#E2DAFF;
  --ok:#2E9E6B; --ok-fill:#27865A; --ok-ink:#20734D; --ok-wash:#E8F5EE;
  --warn:#C77A16; --warn-ink:#8A5410; --warn-wash:#FBF0DD;
  --gold:#B8860B; --gold-ink:#7A5A07; --gold-wash:#FDF6E3;
  --radius:14px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(30,34,42,.06),0 1px 3px rgba(30,34,42,.04);
  --shadow:0 4px 16px rgba(30,34,42,.08),0 1px 3px rgba(30,34,42,.05);
  --shadow-lg:0 18px 50px rgba(30,34,42,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{font-family:var(--font);color:var(--ink);background:var(--canvas);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--red);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.hidden{display:none!important}

/* ---------- badges & chips ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge .d{width:6px;height:6px;border-radius:50%}
.b-ok{color:var(--ok-ink);background:var(--ok-wash)} .b-ok .d{background:var(--ok)}
.b-warn{color:var(--warn-ink);background:var(--warn-wash)} .b-warn .d{background:var(--warn)}
.b-risk{color:var(--red);background:var(--red-wash)} .b-risk .d{background:var(--red)}
.b-neut{color:var(--ink-2);background:var(--line-2)} .b-neut .d{background:var(--ink-3)}
.b-ai{color:var(--ai-ink);background:var(--ai-wash);border:1px solid var(--ai-line)}
.track-chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.track-general{background:#EAF1F8;color:#1A56A0}
.track-entrepreneurship{background:#FDF0E6;color:#A04E15}
.track-ai{background:var(--ai-wash);color:var(--ai-ink)}

/* inferred yellow card */
.inferred{background:#FFFBEB;border:1px solid #F5E1A4;border-left:4px solid #E8B931;border-radius:10px;
  padding:10px 14px;margin:12px 0;font-size:13px;color:#6B5310;display:flex;gap:10px;align-items:flex-start}
.inferred b{color:#4A3A0A}
.inferred .tag{flex:none;font-size:10px;font-weight:800;letter-spacing:.05em;background:#E8B931;color:#3D2F07;
  padding:2px 8px;border-radius:6px;margin-top:1px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;padding:10px 18px;border-radius:10px;border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(200,16,46,.28)}
.btn-primary:hover{background:var(--red-deep);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-ai{background:linear-gradient(120deg,#6D5CF0,#9B4DF5);color:#fff;box-shadow:0 6px 20px rgba(109,92,240,.25)}
.btn-ai:hover{transform:translateY(-1px)}
.btn-ok{background:var(--ok-fill);color:#fff}
.btn-danger{background:#C8102E;color:#fff;border-color:#C8102E}
.doc-body{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:13px;line-height:1.55;background:var(--bg)}
.doc-body p{margin:0 0 9px}
.doc-ph{color:var(--ink-3);font-size:11.5px;font-style:italic}
.doc-tick{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin-top:11px;cursor:pointer}
.doc-tick input{margin-top:2px;flex:none}
.faq{max-width:760px;margin-top:14px}
.faq-item{border-bottom:1px solid var(--line);padding:2px 0}
.faq-item>summary{cursor:pointer;list-style:none;padding:14px 26px 14px 0;font-weight:650;
  font-size:15px;position:relative}
.faq-item>summary::-webkit-details-marker{display:none}
.faq-item>summary::after{content:'+';position:absolute;right:4px;top:12px;font-size:19px;
  color:var(--ink-3);font-weight:400}
.faq-item[open]>summary::after{content:'–'}
.faq-item>p{margin:0 0 16px;font-size:14.5px;line-height:1.6;color:var(--ink-2);max-width:66ch}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:8px}
/* The manual promises check-in "usable on a phone at the door" — at 375px the small
   buttons were ~29px tall, under any touch-target guideline. Finger-sized on touch
   layouts, unchanged on desktop. */
@media (max-width:700px){ .btn.sm{padding:11px 15px} .co-item{padding:11px 12px} }
.btn:disabled{opacity:.5;cursor:default;transform:none!important}

/* ---------- microsite ---------- */
.ms-nav{background:var(--red);color:#fff;position:sticky;top:0;z-index:40}
.ms-nav .row{display:flex;align-items:center;gap:22px;height:56px}
.ms-logo{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.3px;color:#fff}
.ms-logo small{display:block;font-size:8.5px;letter-spacing:.18em;font-weight:700;opacity:1}
.ms-nav a{color:#fff;font-size:13px;font-weight:600;opacity:.92}
.ms-nav a:hover{opacity:1;text-decoration:none}
.ms-nav .spacer{flex:1}
/* ---------- pre-login site chrome (Joanne's build spec §B) ---------- */
.ms-logo small{text-transform:uppercase}
.ms-links{display:flex;gap:22px;align-items:center}
.ms-navlink{padding:4px 0;border-bottom:2px solid transparent}
.ms-navlink.is-active{border-bottom-color:#fff;opacity:1}
/* Sign in is deliberately secondary: outlined, never the filled red Apply treatment. */
.ms-signcue{font-size:11.5px;opacity:.85;white-space:nowrap}
.ms-signin{border:1.5px solid rgba(255,255,255,.7);border-radius:8px;padding:6px 13px;white-space:nowrap}
.ms-signin:hover{background:rgba(255,255,255,.12)}
.ms-burger{display:none;background:transparent;border:1.5px solid rgba(255,255,255,.5);color:#fff;
  border-radius:8px;font-size:12.5px;font-weight:650;padding:6px 11px}
.ms-drawer{display:none;flex-direction:column;gap:2px;padding-bottom:12px}
.ms-drawer .ms-navlink{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.pp-nav{background:var(--ink)}
.pp-nav .ms-navlink.is-active{border-bottom-color:#fff}
.ext{font-size:10px;vertical-align:super}
.ms-footer .ext{opacity:.8}
/* Mentor lane is navy so the two audiences are visually distinct (spec §F). */
.ms-hero.hero-navy{background:linear-gradient(160deg,#1B2A44 0%,#0F1B2E 100%)}
.ms-hero.hero-navy .btn-primary{box-shadow:0 2px 10px rgba(0,0,0,.35)}
.cards2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.lane-mentee h3{color:var(--red)}
.lane-mentor h3{color:#1B2A44}
.ms-list{margin:10px 0 0;padding:0;list-style:none;max-width:760px}
.ms-list li{position:relative;padding:8px 0 8px 20px;font-size:14px;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.ms-list li::before{content:"·";position:absolute;left:4px;font-weight:800;color:var(--red)}
.arc-strip{font-size:13px;color:var(--ink-2);margin:0 0 4px;max-width:900px}
.rot-card{border-top:3px solid var(--red)}
.hero-navy ~ .ms-section .rot-card{border-top-color:#1B2A44}
.rot-label{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--red)}
.hero-navy ~ .ms-section .rot-label{color:#1B2A44}
.rot-card p{font-size:13px;color:var(--ink-2);margin:0}
.reflect-bar{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-top:16px;
  background:var(--cream);border-radius:12px;padding:14px 18px;font-size:13.5px;color:#6b5d49}
.reflect-bar b{color:var(--red);white-space:nowrap}
.role-block{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:16px;max-width:820px}
.role-block p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2)}
.ms-closing{background:var(--ai-wash);border-top:1px solid var(--line)}
/* FAQ page: tabs + single-open accordions (spec "FAQ behaviour") */
.faq-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.faq-tab{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:20px;padding:7px 16px;font-size:13px;font-weight:650}
.faq-tab.is-active{background:var(--red);border-color:var(--red);color:#fff}
.faq-group{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--red);margin:22px 0 0}
.faq-flag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn-ink);
  background:var(--warn-wash);border:1px solid #F0DFA0;border-radius:5px;padding:1px 7px;white-space:nowrap}
/* Resources library (post-login) */
.res-head{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--red);margin:26px 0 8px}
.res-row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.res-desc{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ms-hero{background:linear-gradient(160deg,var(--red) 0%,#8F0C20 100%);color:#fff;padding:64px 0 56px}
.ms-hero h1{font-family:var(--display);font-size:44px;font-weight:800;letter-spacing:-1.5px;margin:0 0 10px;max-width:640px;line-height:1.08}
.ms-hero p{font-size:16.5px;opacity:.92;max-width:560px;margin:0 0 26px;line-height:1.6}
.ms-hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.ms-hero .btn-light{background:#fff;color:var(--red)}
.ms-hero .btn-line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.65)}
.ms-hero .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.95;margin-bottom:14px}
.ms-strip{background:var(--cream);padding:14px 0;font-size:13px;color:#6b5d49;text-align:center;font-weight:600}
.ms-section{padding:52px 0}
.ms-section h2{font-family:var(--display);font-size:26px;font-weight:750;letter-spacing:-.6px;margin:0 0 6px}
.ms-section .lede{color:var(--ink-2);margin:0 0 26px;max-width:620px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm)}
.tcard h3{margin:8px 0 8px;font-size:17px;font-weight:750}
.tcard p{margin:0;font-size:13.5px;color:var(--ink-2)}
.tcard .glyph{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.timeline{display:flex;gap:0;margin-top:8px;overflow-x:auto;padding-bottom:8px}
.tl-node{flex:1;min-width:150px;position:relative;padding:0 10px 0 0}
.tl-node::before{content:"";position:absolute;top:9px;left:0;right:0;height:2px;background:var(--line)}
.tl-node .dot{position:relative;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;z-index:1}
.tl-node h4{margin:10px 0 3px;font-size:13.5px}
.tl-node p{margin:0;font-size:12px;color:var(--ink-3)}
.ms-footer{background:var(--ink);color:#B7BEC9;padding:28px 0;font-size:12.5px;margin-top:20px}
.ms-footer a{color:#fff}
.doc-page{max-width:760px;margin:0 auto;padding:40px 22px 70px}
.doc-page h1{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.8px;margin:0 0 8px}
.doc-page .lede{color:var(--ink-2);font-size:15px;margin-bottom:24px}
.doc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.doc-card h3{margin:0 0 8px;font-size:16px}
.doc-card ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.doc-card li{margin:4px 0}
.privacy-note{background:var(--ok-wash);border:1px solid #CBE8D8;border-radius:10px;padding:12px 16px;
  font-size:13.5px;color:#1E5C40;font-weight:600;display:flex;gap:10px;align-items:flex-start;margin-bottom:20px}

/* ---------- forms ---------- */
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-sm)}
.f-row{margin-bottom:15px}
.f-row label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.f-row label .req{color:var(--red)}
/* Every input except the tick boxes. Listing types by hand left password fields
   unstyled — they fell back to the browser default width next to a full-width
   text field, which is what made the sign-in form look broken. */
.f-row input:not([type=checkbox]):not([type=radio]),.f-row select,.f-row textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:14px;background:var(--surface-2);color:var(--ink)}
.f-row textarea{min-height:74px;resize:vertical}
.f-row input:focus,.f-row select:focus,.f-row textarea:focus{outline:2px solid var(--ai);outline-offset:0;border-color:transparent}
/* Chrome paints autofilled fields pale blue and ignores background-color; the only
   reliable override is an inset shadow. */
.f-row input:-webkit-autofill,.f-row input:-webkit-autofill:hover,.f-row input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 40px var(--surface) inset;box-shadow:0 0 0 40px var(--surface) inset;
  -webkit-text-fill-color:var(--ink);caret-color:var(--ink)}
.f-check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.f-check input{margin-top:3px;width:16px;height:16px;accent-color:var(--red)}
.f-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.track-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.track-opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface-2)}
.track-opt.sel{border-color:var(--red);background:var(--red-wash)}
.track-opt h4{margin:0 0 3px;font-size:13.5px}
.track-opt p{margin:0;font-size:11.5px;color:var(--ink-3)}

/* ---------- email toast/modal ---------- */
.email-pop{position:fixed;right:20px;bottom:20px;width:420px;max-width:92vw;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow-lg);z-index:90;overflow:hidden;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.email-pop .head{background:var(--ink);color:#fff;padding:10px 16px;font-size:11.5px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.email-pop .head .x{margin-left:auto;background:none;border:0;color:#fff;font-size:16px;opacity:.7}
.email-pop .body{padding:14px 16px}
.email-pop .subj{font-weight:700;font-size:14px;margin-bottom:4px}
.email-pop .meta{font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.email-pop .txt{font-size:13px;color:var(--ink-2)}

/* ---------- personal page ---------- */
.pp-shell{max-width:720px;margin:0 auto;padding:30px 20px 70px}
.pp-head{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.avatar{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none}
.av-mentor{background:linear-gradient(135deg,#C8102E,#8F0C20)}
.av-mentee{background:linear-gradient(135deg,#3A4150,#282D37)}
.pp-head h1{font-family:var(--display);font-size:24px;font-weight:800;margin:0;letter-spacing:-.5px}
.pp-head .sub{font-size:13px;color:var(--ink-2)}
.steps{display:flex;gap:0;margin:6px 0 24px;overflow-x:auto;padding-bottom:6px}
.step{flex:1;min-width:86px;text-align:center;position:relative}
.step::before{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--red)}
.step .dot{position:relative;width:21px;height:21px;margin:0 auto;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--ink-3)}
.step.done .dot{background:var(--red);border-color:var(--red);color:#fff}
.step.cur .dot{border-color:var(--red);color:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.15)}
.step span{display:block;font-size:10.5px;font-weight:650;color:var(--ink-3);margin-top:6px}
.step.done span,.step.cur span{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:9px}
.acklist{display:flex;flex-direction:column;gap:8px}
.ackrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;background:var(--surface-2)}
.ackrow .nm{font-size:13.5px;font-weight:650;flex:1}
.ackrow .ver{font-size:11px;color:var(--ink-3)}
.mentor-card{display:flex;gap:14px;align-items:flex-start;background:var(--ai-wash);border:1px solid var(--ai-line);border-radius:12px;padding:14px 16px}
.cert{background:linear-gradient(160deg,#FFFDF5,#FDF6E3);border:1.5px solid #E5D9A9;border-radius:14px;padding:28px;text-align:center}
.cert h2{font-family:var(--display);font-size:22px;margin:8px 0 4px;letter-spacing:-.4px}
.cert .nm{font-size:26px;font-weight:800;color:var(--red);margin:10px 0}
.cert .meta{font-size:12px;color:var(--ink-3)}

/* ---------- console ---------- */
.co-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.co-side{background:#1E222A;color:#AEB6C2;padding:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.co-brand{padding:18px;border-bottom:1px solid #343B46;color:#fff;font-weight:800;font-family:var(--display)}
.co-brand small{display:block;font-size:9px;letter-spacing:.16em;color:#9AA2B0;font-weight:700}
.co-nav{padding:10px;flex:1;overflow-y:auto}
.co-nav .lab{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#8C94A2;font-weight:800;padding:10px 10px 4px}
.co-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 11px;border-radius:8px;border:0;background:transparent;color:#AEB6C2;font-size:13px;font-weight:600}
.co-item:hover{background:#272C36;color:#fff}
.co-item.on{background:var(--red);color:#fff}
.co-item .n{margin-left:auto;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.14);color:#fff;padding:1px 7px;border-radius:12px}
.co-user{padding:13px 16px;border-top:1px solid #343B46;font-size:12px}
.co-user b{color:#fff;display:block;font-size:13px}
.co-main{min-width:0;padding:26px 30px 70px;max-width:1100px}
.co-title{font-family:var(--display);font-size:23px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px}
.co-sub{color:var(--ink-2);font-size:13px;margin:0 0 20px;max-width:640px}
table.tb{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.tb th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tb td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.funnel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-sm)}

/* ---------- seed builder ---------- */
function buildSeed(){
  const used = new Set();
  const people = [];
  let seq = 1;
  const slug = s => s.toLowerCase().replace(/[^a-z ]/g,'').trim().replace(/ +/g,'-');
  const isoAt = (date,h,m)=>`${date}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00+08:00`;

  const mk = (kind, appStatus) => {
    const nm = uname(used);
    const id = (kind==='mentor'?'M':'E') + String(seq++).padStart(3,'0');
    const p = {id, kind, name:nm.full, firstName:nm.first, lastName:nm.last,
      email: nm.full.toLowerCase().replace(/[^a-z ]/g,'').replace(/ +/g,'.') + (kind==='mentor'?'@example.com':'@smu.example.edu'),
      mobile: '+65 9'+String(100+Math.floor(rnd()*900))+' '+String(1000+Math.floor(rnd()*9000)),
      nationality: pick(NATIONALITIES),
      linkedin: 'linkedin.com/in/'+slug(nm.full),
      appStatus, submittedAt:'2026-09-0'+(1+Math.floor(rnd()*9)),
      ack:null, source:'form'};
    p.pdpaAt = isoAt(p.submittedAt, 9+Math.floor(rnd()*11), Math.floor(rnd()*60));
    if(kind==='mentor'){
      const posting = pick(ORG_POOL);
      const returning = rnd()<0.22;
      Object.assign(p,{org:posting[0], designation:pick(DESIGNATIONS), industry:posting[1],
        heard: returning ? FORM_OPTS.heardMentor[0] : pick(FORM_OPTS.heardMentor.slice(1)),
        returning,
        interests: pick(INTERESTS_POOL),
        draws: pickN(FORM_OPTS.draws, 1+Math.floor(rnd()*3)),
        anythingElse:'',
        commit:'yes', whatsappConsent: rnd()<0.9?'Yes':'No'});
      if(p.whatsappConsent==='No') p.contactPref = pick(['Phone call','Email']);
      if(!returning){
        Object.assign(p,{yearsExp:pick(FORM_OPTS.yearsExp.slice(1)), ledTeam:'Yes',
          leadership:pick(LEADERSHIP_POOL), crossIndustry:pick(FORM_OPTS.crossIndustry),
          priorMentoring: rnd()<0.6?'Yes':'No'});
      }
      p.background = `${p.yearsExp||'previous-cycle mentor'}${p.yearsExp?' of experience':''} in ${p.industry===IND_OTHER?'their field':p.industry}`;
    }else{
      const fac = pick(FACULTIES);
      Object.assign(p,{university:'SMU', faculty:fac, faculty2:'Not applicable',
        degree:pick(DEGREES[fac]), year:pick(['Year 1','Year 2','Year 2','Year 3','Year 3','Year 4']),
        eligibilityConfirmed:true,
        heard:pick(FORM_OPTS.heardMentee),
        prompt1:`Six months from now I hope to have grown ${pick(P1_GROW)}. ${pick(P1_MOMENT)}, and I want to keep building that muscle with a mentor who will hold me to it.`,
        prompt2:`I keep getting pulled toward ${pick(P2_PULL)}. Beyond my own field I read widely and ask a lot of questions. In this community I would want to show up by ${pick(P2_SHOW)}.`,
        industryPrefs: pickN(INDUSTRIES.filter(i=>i!==IND_OTHER), 3),
        commit:'yes', telegramConsent: rnd()<0.92?'Yes':'No'});
      if(p.heard===FORM_OPTS.heardMentee[0]) p.referrer = uname(used).full;
      if(p.telegramConsent==='No') p.contactPref = pick(['Email','Phone']);
    }
    people.push(p); return p;
  };

  // Mentors: 60 accepted + 8 Reserve Mentor list + 3 declined + 2 fresh submitted
  const mentors = [];
  for(let i=0;i<60;i++) mentors.push(mk('mentor','accepted'));
  const mentorReserve = []; for(let i=0;i<8;i++) mentorReserve.push(mk('mentor','reserve_invited'));
  mentorReserve.forEach((m,i)=>{ m.reserveOptIn = i<6 ? true : null; if(m.reserveOptIn) m.reserveRepliedAt='2026-09-2'+(0+i%4); });
  for(let i=0;i<3;i++) mk('mentor','declined');
  for(let i=0;i<2;i++) mk('mentor','submitted');

  // Mentees: 60 accepted (cap) + 8 Reserve Mentee list + 3 declined-not-selected + 1 declined-ineligible + 2 fresh submitted
  const mentees = [];
  for(let i=0;i<60;i++) mentees.push(mk('mentee','accepted'));
  const menteeReserve = []; for(let i=0;i<8;i++) menteeReserve.push(mk('mentee','reserve_invited'));
  menteeReserve.forEach((m,i)=>{ m.reserveOptIn = i<4 ? true : (i<7 ? null : false); if(m.reserveOptIn!==null) m.reserveRepliedAt='2026-09-2'+(1+i%3); });
  for(let i=0;i<3;i++) mk('mentee','declined_not_selected');
  const inel = mk('mentee','declined_ineligible'); inel.eligibilityConfirmed=false; inel.email=inel.email.replace('@smu.example.edu','@example.com');
  for(let i=0;i<2;i++) mk('mentee','submitted');

  /* Acceptance gate (Rules + COI + Kick-Off, separately timestamped): everyone accepted
     has completed it EXCEPT 2 late mentees (blocked-at-the-gate demo + reminder target). */
  const lateAck = pickN(mentees.filter(e=>e.appStatus==='accepted'),2);
  const kickoffExceptions = [];
  people.filter(p=>p.appStatus==='accepted').forEach(p=>{
    if(lateAck.includes(p)) return;                          // gate untouched — place NOT confirmed
    /* Between the outcome batch (14 Sept) and the acceptance deadline (20 Sept). It used
       to run 17–24 Sept, which put a quarter of the cohort through the gate after the
       deadline that is supposed to close it — invisible in the UI, wrong in the data. */
    const d = '2026-09-'+String(15+Math.floor(rnd()*6)).padStart(2,'0');
    const hh = 9+Math.floor(rnd()*12), mm = Math.floor(rnd()*60);
    p.ack = {rules:isoAt(d,hh,mm), coi:isoAt(d,hh,Math.min(59,mm+2)), kickoff:isoAt(d,hh,Math.min(59,mm+4))};
    p.coi = {declared:false, details:''};
    p.kickoff = {status:'confirmed'};
    p.placeConfirmedAt = d;
    if(rnd()<0.4) p.kickoffLogistics = {arrival: rnd()<0.15?'arriving around 7.45 pm from work':'', dietary: pick(DIETARY)};
  });
  // one declared conflict (visible to the Lead in matching), three Kick-Off exceptions
  const coiCase = mentors.find(m=>m.appStatus==='accepted'&&m.ack);
  coiCase.coi = {declared:true, details:'My niece is an SMU undergraduate who may apply as a mentee this cycle.'};
  const exc1 = mentors.filter(m=>m.appStatus==='accepted'&&m.ack)[3];
  exc1.kickoff = {status:'exception_requested', reason:'I am overseas for work that entire week; I can join the first mentoring session the week after.'};
  kickoffExceptions.push(exc1.id);
  const exc2 = mentees.filter(e=>e.appStatus==='accepted'&&e.ack)[5];
  exc2.kickoff = {status:'exception_requested', reason:'I have a family commitment that evening and cannot attend in person.'};
  exc2.kickoff.resolved = {outcome:'waived', by:'Wei Kiat', at:'2026-09-26'};
  kickoffExceptions.push(exc2.id);

  /* reviews: every non-fresh applicant has 2 reviewer scores against the criteria */
  const REVIEWERS = {mentor:['Esther','Wei Kiat','Kenzie','Yu Tong'], mentee:['Esther','Wei Kiat','Portia','Sapranshu']};
  const reviews = [];
  people.forEach(p=>{
    if(p.appStatus==='submitted') return;
    const crits = (p.kind==='mentor'?MENTOR_CRITERIA:MENTEE_CRITERIA).filter(c=>c.scored);
    pickN(REVIEWERS[p.kind],2).forEach(rv=>{
      const criteria = {}; crits.forEach(c=>{ criteria[c.key] = 3+Math.floor(rnd()*3); });
      const avg = Math.round(Object.values(criteria).reduce((s,x)=>s+x,0)/crits.length*10)/10;
      reviews.push({personId:p.id,reviewer:rv,score:avg,comment:pick(REVIEW_COMMENTS),criteria});
    });
  });

  /* pairs — R1 (closed) + R2 (running). ≤2 mentees/mentor, no repeat mentor; the seed
     prefers industry-preference fits the way the matching engine would. */
  const activeMentors = mentors.filter(m=>m.appStatus==='accepted');
  const activeMentees = mentees.filter(e=>e.appStatus==='accepted');
  const pairs=[]; let pid=1;
  const capUsed = {};                                          // rotation -> mentorId -> count
  const history = {};                                          // menteeId -> Set(mentorId)
  function pairUp(rotation, mentee, statusPlan){
    const cands = activeMentors.filter(m=>(capUsed[rotation]?.[m.id]||0) < 2
      && !(history[mentee.id]?.has(m.id)));
    if(!cands.length) return null;
    const pref = cands.filter(m=>(mentee.industryPrefs||[]).includes(m.industry));
    const mentor = (pref.length && rnd()<0.75) ? pick(pref) : pick(cands);
    capUsed[rotation]=capUsed[rotation]||{}; capUsed[rotation][mentor.id]=(capUsed[rotation][mentor.id]||0)+1;
    history[mentee.id]=history[mentee.id]||new Set(); history[mentee.id].add(mentor.id);
    const prefIx = (mentee.industryPrefs||[]).indexOf(mentor.industry);
    const pr={id:'P'+String(pid++).padStart(3,'0'), rotation, mentorId:mentor.id, menteeId:mentee.id,
      status:statusPlan,
      approvedAt: rotation===1 ? '2026-09-'+String(24+Math.floor(rnd()*5)).padStart(2,'0')
                               : '2026-11-'+String(26+Math.floor(rnd()*5)).padStart(2,'0'),
      rationale:[ prefIx>=0
          ? `${['First','Second','Third'][prefIx]}-preference industry: mentee chose ${mentor.industry}; mentor brings ${mentor.background} at ${mentor.org}`
          : `Mentor brings ${mentor.background} at ${mentor.org}; breadth and availability fit`,
        `Capacity and no-repeat checks passed`]};
    pairs.push(pr); return pr;
  }
  // R1: everyone paired EXCEPT the gate-blocked (place not confirmed → never matched)
  const r1=[]; activeMentees.filter(e=>!lateAck.includes(e)).forEach(e=>{const p=pairUp(1,e,'approved'); if(p)r1.push(p)});
  const r1Missing = pickN(r1,3);
  r1.forEach(p=>{ if(!r1Missing.includes(p)){ p.status='closed';
      p.closeoff={metTwice:true,reflectionDone:true,at:'2026-11-'+String(25+Math.floor(rnd()*5)),comment:pick(['Great pairing.','Learned a lot.','We clicked well.',''])};}});
  // R2: most paired; 8 mentees left unmatched (live matching demo); 1 mentor dropout staged
  const unmatchedR2 = pickN(activeMentees.filter(e=>!lateAck.includes(e)),6).concat(lateAck); // 8 total, incl. 2 gate-blocked
  activeMentees.forEach(e=>{ if(!unmatchedR2.includes(e)) pairUp(2,e,'approved'); });
  // dropout: pick a mentor with 2 R2 pairs
  const byMentor={}; pairs.filter(p=>p.rotation===2).forEach(p=>{(byMentor[p.mentorId]=byMentor[p.mentorId]||[]).push(p)});
  const dropMentorId = Object.keys(byMentor).find(k=>byMentor[k].length===2) || Object.keys(byMentor)[0];
  const dropped = people.find(p=>p.id===dropMentorId);
  dropped.droppedOut = {at:'2026-12-10', reason:'work relocation'};
  byMentor[dropMentorId].forEach(p=>{p.status='rematch_needed'});

  /* fast-forward previews: 2 mentees with all 3 rotations closed (certificate/builder-reflection demo) */
  const r1MissingMentees = new Set(r1Missing.map(p=>p.menteeId));
  const preview = pickN(activeMentees.filter(e=>!unmatchedR2.includes(e) && !r1MissingMentees.has(e.id)),2);
  preview.forEach(e=>{
    const pr2 = pairs.find(p=>p.rotation===2 && p.menteeId===e.id);
    if(pr2){pr2.status='closed'; pr2.closeoff={metTwice:true,reflectionDone:true,at:'2026-12-14',comment:''};}
    const p3=pairUp(3,e,'closed'); if(p3){p3.approvedAt='2027-02-01';p3.closeoff={metTwice:true,reflectionDone:true,at:'2027-03-10',comment:''};p3.preview=true;}
    e.previewFastForward = true;
  });
  /* Their paperwork must exist too, or Submissions sits empty and the preview stops
     half-way. One preview mentee gets her Builder's Commitment (happy path on
     Certificates); the other stays without (the ✗ shows what the rule still demands). */
  const midreviews=[], builderReflections=[];
  const pvMentors=[...new Set(pairs.filter(p=>p.preview||p.rotation===2&&preview.some(e=>e.id===p.menteeId))
    .map(p=>p.mentorId))].slice(0,2);
  const MIDTEXT=['Pairing is going well — we have met twice and are working through interview preparation. No support needed.',
                 'Good engagement from my mentee; we agreed on a networking plan for the new year. One scheduling wobble, resolved.'];
  pvMentors.forEach((mid,i)=>midreviews.push({mentorId:mid, text:MIDTEXT[i%MIDTEXT.length], at:'2027-01-1'+(8+i)}));
  const menteeMidReviews=[], endEvaluations=[];
  if(preview[0]){
    menteeMidReviews.push({menteeId:preview[0].id, text:'Mid-programme check-in: rotation pace works well; my mentor pushes me to prepare better questions.', at:'2027-01-20'});
    endEvaluations.push({personId:preview[0].id, kind:'mentee', text:'GRMP delivered exactly what it promised — three genuinely different mentors and a habit of structured reflection.', at:'2027-03-11'});
    endEvaluations.push({personId:pvMentors[0], kind:'mentor', text:'A strong close to the programme; my mentee arrived prepared every single session.', at:'2027-03-12'});
  }
  if(preview[1]){
    menteeMidReviews.push({menteeId:preview[1].id, text:'Enjoying the rotations; the switch of mentors each rotation is the best part.', at:'2027-01-21'});
    // deliberately NO end evaluation for preview[1] — the exception report needs a live case
  }
  if(preview[0]) builderReflections.push({menteeId:preview[0].id, at:'2027-03-12',
    text:'GRMP gave me three very different mirrors. I will pay it forward by mentoring two juniors in my CCA and starting a monthly peer career circle.'});

  /* The outcome batch already went out in this cohort's timeline: one send on 14 Sept
     carrying every decision made during the 10–13 Sept review window. Decisions taken
     after a batch has been released send individually — see D.decide. */
  people.filter(p=>['accepted','reserve_invited','declined','declined_not_selected','declined_ineligible'].includes(p.appStatus))
        .forEach(p=>{ p.decisionAt='2026-09-14'; p.outcomeSentAt='2026-09-14'; });
  const outcomeBatch = {at:'2026-09-14', by:'Wei Kiat', count:people.filter(p=>p.outcomeSentAt).length};

  /* events — Kick-Off details are spec-confirmed constants */
  const confirmedIds = people.filter(p=>p.appStatus==='accepted' && p.kickoff && p.kickoff.status==='confirmed').map(p=>p.id);
  const events = {
    kickoff:      {name:'Kick-Off Night', date:'2026-10-01', time:'7.30 p.m. to 9.00 p.m.', venue:'SMU ALCove, 80 Stamford Road, #B1-62, Singapore 178902', attendance:pickN(confirmedIds, Math.floor(confirmedIds.length*0.9))},
    /* Moved off 26 Mar 2027 on Esther's 18 Aug note: that Friday is Good Friday, a gazetted
       Singapore public holiday. Nothing in the build had ever checked a programme date against
       the calendar people actually live in — see the non-working-day sweep in backend_test.js. */
    appreciation: {name:'Appreciation Night', date:'2027-04-02', venue:'to be confirmed', attendance:[]},
  };

  /* concerns: 1 sample referral */
  const concerns = [{id:'C001', at:'2026-11-18', from:'(mentee — identity visible to Escalation Owner only)',
    summary:'Raised a concern about repeated last-minute cancellations', status:'referred to SMC Grievance process'}];

  /* email log (what the system sent, template-rendered — open any row to read the verbatim body) */
  const sampleAcceptM = mentors[0], sampleAcceptE = mentees[0];
  const sampleReserveM = mentorReserve[0], sampleReserveE = menteeReserve[0];
  const lateOne = lateAck[0];
  const emails = [
    {at:'2026-08-31', to:'mentor invitation list (mail-merge)', tpl:'mentor_invite', vars:{name:'[Name]'}, kind:'invite', by:'Esther Koh'},
    {at:'2026-08-31', to:'mentee invitation list (mail-merge)', tpl:'mentee_invite', vars:{name:'[Name]'}, kind:'invite', by:'Wei Kiat Koh'},
    {at:sampleAcceptM.submittedAt, to:sampleAcceptM.email, tpl:'mentor_receipt', vars:{name:sampleAcceptM.name}, kind:'receipt'},
    {at:sampleAcceptE.submittedAt, to:sampleAcceptE.email, tpl:'mentee_receipt', vars:{name:sampleAcceptE.name}, kind:'receipt'},
    {at:'2026-09-14', to:sampleAcceptM.email, tpl:'mentor_accept', vars:{name:sampleAcceptM.name, link:'#/me/'+sampleAcceptM.id}, kind:'decision'},
    {at:'2026-09-14', to:sampleAcceptE.email, tpl:'mentee_accept', vars:{name:sampleAcceptE.name, link:'#/me/'+sampleAcceptE.id}, kind:'decision'},
    {at:'2026-09-14', to:sampleReserveM.email, tpl:'mentor_reserve', vars:{name:sampleReserveM.name}, kind:'decision'},
    {at:'2026-09-14', to:sampleReserveE.email, tpl:'mentee_reserve', vars:{name:sampleReserveE.name}, kind:'decision'},
    {at:'2026-09-18', to:lateOne.email, tpl:'mentee_accept_reminder', vars:{name:lateOne.name, link:'#/me/'+lateOne.id}, kind:'reminder'},
    {at:'2026-09-28', to:'all matched pairs', subject:'Your Rotation 1 match: Know Yourself', kind:'match'},
    {at:'2026-11-25', to:'mentees', subject:'Rotation 1 close-off — two quick confirmations', kind:'closeoff'},
    {at:'2026-11-30', to:'all matched pairs', subject:'Your Rotation 2 match: Know Your World', kind:'match'},
  ];
  lateOne.acceptReminderAt = '2026-09-18';

  /* preset accounts: 6 admins + 5 participant personas (picked deterministically) */

const Store = {
  load(){
    try{ const raw = localStorage.getItem(DB_KEY); if(raw){ const db=JSON.parse(raw); if(db.version===1) return db; } }catch(e){}
    const db = buildSeed(); localStorage.setItem(DB_KEY, JSON.stringify(db)); return db;
  },
  save(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); },
  reset(){ localStorage.removeItem(DB_KEY); return Store.load(); },
};

/* ---------- domain helpers (shared by views + tests) ---------- */
const D = {
  person:(db,id)=>db.people.find(p=>p.id===id),
  mentors:db=>db.people.filter(p=>p.kind==='mentor'),
  mentees:db=>db.people.filter(p=>p.kind==='mentee'),
  /* R5: place confirmed = the acceptance gate is complete (Rules + COI + Kick-Off,
     each separately timestamped). This is the single definition the dashboard, the
     reminders, matching eligibility and the release rule all read. */
  ackComplete:p=>p.ack && ['rules','coi','kickoff'].every(d=>p.ack[d]),
  placeConfirmed:p=>D.ackComplete(p),
  gateBlocked:p=>['accepted'].includes(p.appStatus) && !D.ackComplete(p),
  currentRotation:db=>{const t=db.today;return db.config.rotations.find(r=>t>=r.start&&t<=r.end)||null},
  pairsFor:(db,personId)=>db.pairs.filter(p=>p.mentorId===personId||p.menteeId===personId),
  logAudit(db, at, actor, action, entity){
    db.audit.push({at, ts:new Date().toISOString(), actor, action, entity});
  },
  wordCount:s=>String(s||'').trim().split(/\s+/).filter(Boolean).length,
  /* ---- cohort facts: the single source for every user-visible cohort number, date,
     institution name and window. Views must read from here, never carry a literal. ---- */
  shiftDate:(iso,days)=>{const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10)},
  monthName:iso=>['January','February','March','April','May','June','July','August','September','October','November','December'][Number(iso.slice(5,7))-1],
  monthShort:iso=>D.monthName(iso).slice(0,4)==='Sept'?'Sept':D.monthName(iso).slice(0,3),
  /* Strict three-letter month. The pre-login spec pins the Home timeline to "Sep" and body
     prose to "September", and says in as many words not to normalise one into the other. */
  mon3:iso=>D.monthName(iso).slice(0,3),
  fmtDayMon3:iso=>`${Number(iso.slice(8,10))} ${D.mon3(iso)}`,
  fmtLongNoYear:iso=>`${Number(iso.slice(8,10))} ${D.monthName(iso)}`,
  fmtDMY:iso=>`${Number(iso.slice(8,10))} ${D.monthShort(iso)} ${iso.slice(0,4)}`,
  fmtLong:iso=>`${Number(iso.slice(8,10))} ${D.monthName(iso)} ${iso.slice(0,4)}`,
  registrationOpen(db){
    const r=db.config.registration;
    return !r || (db.today>=r.opens && db.today<=r.closes);
  },
  cohortFacts(db){
    const c=db.config, r=c.rotations, label=c.cohort.label;
    const short=label.replace(/\s*\(.*\)\s*/,'').trim();
    const inst=(label.match(/\(([^)]*?)(?:\s+pilot)?\)/i)||[])[1]||'';
    const sel=c.selection||{};
    const kickoff=(db.events&&db.events.kickoff&&db.events.kickoff.date)||r[0].start;
    const appre = db.events && db.events.appreciation && db.events.appreciation.date;
    const span = (a,b)=>`${D.monthName(a)} ${a.slice(0,4)!==b.slice(0,4)?a.slice(0,4)+' ':''}to ${D.monthName(b)} ${b.slice(0,4)}`;
    return {label, short, inst,
      pairName: inst ? inst+'–SMC' : 'SMC',
      progFull: (inst ? inst+'–SMC' : 'SMC')+' Global-Ready Mentoring Programme (GRMP)',
      enquiries: (c.mail&&c.mail.replyTo)||'smu.smc@sa.smu.edu.sg',
      mailFrom: (c.mail&&c.mail.from)||'SMC GRMP Team',
      appreciationDate: appre ? D.fmtLong(appre) : null,   // "2 April 2027", like every other date in the build
      /* The move off Good Friday pushed it past the last rotation, so the copy can no
         longer imply it happens inside the six months. Derived, not asserted: if a future
         cycle lands it back inside the cycle the sentence disappears by itself. */
      appreciationAfterCycle: !!(appre && appre > r[2].end),
      mentors: db.people.filter(p=>p.kind==='mentor'&&p.appStatus==='accepted').length,
      mentees: db.people.filter(p=>p.kind==='mentee'&&p.appStatus==='accepted').length,
      reserveN: db.people.filter(p=>p.appStatus==='reserve_invited').length,
      menteeCap: sel.menteeCap||60,
      spanLong:`${D.monthName(r[0].start)} ${r[0].start.slice(0,4)} to ${D.monthName(r[2].end)} ${r[2].end.slice(0,4)}`,
      spanMonths:`${D.monthName(r[0].start)} to ${D.monthName(r[2].end)}`,
      cycleSpanLong:`${D.fmtLong(r[0].start)} to ${D.fmtLong(r[2].end)}`,
      cycleSpanDash:`${D.fmtLong(r[0].start)} – ${D.fmtLong(r[2].end)}`,
      r1Span:span(r[0].start,r[0].end), r2Span:span(r[1].start,r[1].end), r3Span:span(r[2].start,r[2].end),
      applyMonth:D.monthName((c.registration&&c.registration.opens)||r[0].start),
      applyShort:D.monthShort((c.registration&&c.registration.opens)||r[0].start),
      /* "1–10 Sept" was fine while both ends shared a month. The amendments moved the
         opening to 31 Aug and this rendered "31–9 Aug" — caught by tests/date_sweep.js,
         which is the whole argument for sweeping rendered text rather than source. */
      regWindow: c.registration ? (c.registration.opens.slice(0,7)===c.registration.closes.slice(0,7)
        ? `${Number(c.registration.opens.slice(8,10))}–${Number(c.registration.closes.slice(8,10))} ${D.monthShort(c.registration.opens)}`
        : `${Number(c.registration.opens.slice(8,10))} ${D.monthShort(c.registration.opens)} – ${Number(c.registration.closes.slice(8,10))} ${D.monthShort(c.registration.closes)}`) : '',
      regCloses: c.registration ? c.registration.closes : '',
