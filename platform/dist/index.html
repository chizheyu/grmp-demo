<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRMP Platform — SMC (staging)</title>
<style>
/* GRMP Demo — design system. Public microsite (SMC red) + console (ink) + personal pages. */
:root{
  --red:#C8102E; --red-deep:#A00C24; --red-wash:#FBEDEF;
  --ink:#23272F; --ink-2:#4A515E; --ink-3:#8A919E;
  --canvas:#F6F5F2; --surface:#FFFFFF; --surface-2:#FBFAF8;
  --line:#E8E5DF; --line-2:#F1EFEA; --cream:#F5ECE0;
  --ai:#6D5CF0; --ai-ink:#5B45E0; --ai-wash:#F4F1FF; --ai-line:#E2DAFF;
  --ok:#2E9E6B; --ok-wash:#E8F5EE; --warn:#C77A16; --warn-wash:#FBF0DD;
  --gold:#B8860B; --gold-wash:#FDF6E3;
  --radius:14px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(30,34,42,.06),0 1px 3px rgba(30,34,42,.04);
  --shadow:0 4px 16px rgba(30,34,42,.08),0 1px 3px rgba(30,34,42,.05);
  --shadow-lg:0 18px 50px rgba(30,34,42,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{font-family:var(--font);color:var(--ink);background:var(--canvas);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--red);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.hidden{display:none!important}

/* ---------- badges & chips ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge .d{width:6px;height:6px;border-radius:50%}
.b-ok{color:var(--ok);background:var(--ok-wash)} .b-ok .d{background:var(--ok)}
.b-warn{color:var(--warn);background:var(--warn-wash)} .b-warn .d{background:var(--warn)}
.b-risk{color:var(--red);background:var(--red-wash)} .b-risk .d{background:var(--red)}
.b-neut{color:var(--ink-2);background:var(--line-2)} .b-neut .d{background:var(--ink-3)}
.b-ai{color:var(--ai-ink);background:var(--ai-wash);border:1px solid var(--ai-line)}
.track-chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.track-general{background:#EAF1F8;color:#1A56A0}
.track-entrepreneurship{background:#FDF0E6;color:#B85C1E}
.track-ai{background:var(--ai-wash);color:var(--ai-ink)}

/* inferred yellow card */
.inferred{background:#FFFBEB;border:1px solid #F5E1A4;border-left:4px solid #E8B931;border-radius:10px;
  padding:10px 14px;margin:12px 0;font-size:13px;color:#6B5310;display:flex;gap:10px;align-items:flex-start}
.inferred b{color:#4A3A0A}
.inferred .tag{flex:none;font-size:10px;font-weight:800;letter-spacing:.05em;background:#E8B931;color:#fff;
  padding:2px 8px;border-radius:6px;margin-top:1px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;padding:10px 18px;border-radius:10px;border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(200,16,46,.28)}
.btn-primary:hover{background:var(--red-deep);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-ai{background:linear-gradient(120deg,#6D5CF0,#9B4DF5);color:#fff;box-shadow:0 6px 20px rgba(109,92,240,.25)}
.btn-ai:hover{transform:translateY(-1px)}
.btn-ok{background:var(--ok);color:#fff}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default;transform:none!important}

/* ---------- microsite ---------- */
.ms-nav{background:var(--red);color:#fff;position:sticky;top:0;z-index:40}
.ms-nav .row{display:flex;align-items:center;gap:22px;height:56px}
.ms-logo{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.3px;color:#fff}
.ms-logo small{display:block;font-size:8.5px;letter-spacing:.18em;font-weight:700;opacity:.85}
.ms-nav a{color:#fff;font-size:13px;font-weight:600;opacity:.92}
.ms-nav a:hover{opacity:1;text-decoration:none}
.ms-nav .spacer{flex:1}
.ms-hero{background:linear-gradient(160deg,var(--red) 0%,#8F0C20 100%);color:#fff;padding:64px 0 56px}
.ms-hero h1{font-family:var(--display);font-size:44px;font-weight:800;letter-spacing:-1.5px;margin:0 0 10px;max-width:640px;line-height:1.08}
.ms-hero p{font-size:16.5px;opacity:.92;max-width:560px;margin:0 0 26px;line-height:1.6}
.ms-hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.ms-hero .btn-light{background:#fff;color:var(--red)}
.ms-hero .btn-line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.65)}
.ms-hero .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.8;margin-bottom:14px}
.ms-strip{background:var(--cream);padding:14px 0;font-size:13px;color:#6b5d49;text-align:center;font-weight:600}
.ms-section{padding:52px 0}
.ms-section h2{font-family:var(--display);font-size:26px;font-weight:750;letter-spacing:-.6px;margin:0 0 6px}
.ms-section .lede{color:var(--ink-2);margin:0 0 26px;max-width:620px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm)}
.tcard h3{margin:8px 0 8px;font-size:17px;font-weight:750}
.tcard p{margin:0;font-size:13.5px;color:var(--ink-2)}
.tcard .glyph{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.timeline{display:flex;gap:0;margin-top:8px;overflow-x:auto;padding-bottom:8px}
.tl-node{flex:1;min-width:150px;position:relative;padding:0 10px 0 0}
.tl-node::before{content:"";position:absolute;top:9px;left:0;right:0;height:2px;background:var(--line)}
.tl-node .dot{position:relative;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;z-index:1}
.tl-node h4{margin:10px 0 3px;font-size:13.5px}
.tl-node p{margin:0;font-size:12px;color:var(--ink-3)}
.ms-footer{background:var(--ink);color:#B7BEC9;padding:28px 0;font-size:12.5px;margin-top:20px}
.ms-footer a{color:#fff}
.doc-page{max-width:760px;margin:0 auto;padding:40px 22px 70px}
.doc-page h1{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.8px;margin:0 0 8px}
.doc-page .lede{color:var(--ink-2);font-size:15px;margin-bottom:24px}
.doc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.doc-card h3{margin:0 0 8px;font-size:16px}
.doc-card ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.doc-card li{margin:4px 0}
.privacy-note{background:var(--ok-wash);border:1px solid #CBE8D8;border-radius:10px;padding:12px 16px;
  font-size:13.5px;color:#1E5C40;font-weight:600;display:flex;gap:10px;align-items:flex-start;margin-bottom:20px}

/* ---------- forms ---------- */
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-sm)}
.f-row{margin-bottom:15px}
.f-row label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.f-row label .req{color:var(--red)}
.f-row input[type=text],.f-row input[type=email],.f-row select,.f-row textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:14px;background:var(--surface-2);color:var(--ink)}
.f-row textarea{min-height:74px;resize:vertical}
.f-row input:focus,.f-row select:focus,.f-row textarea:focus{outline:2px solid var(--ai);outline-offset:0;border-color:transparent}
.f-check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.f-check input{margin-top:3px;width:16px;height:16px;accent-color:var(--red)}
.f-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.track-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.track-opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface-2)}
.track-opt.sel{border-color:var(--red);background:var(--red-wash)}
.track-opt h4{margin:0 0 3px;font-size:13.5px}
.track-opt p{margin:0;font-size:11.5px;color:var(--ink-3)}

/* ---------- email toast/modal ---------- */
.email-pop{position:fixed;right:20px;bottom:20px;width:420px;max-width:92vw;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow-lg);z-index:90;overflow:hidden;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.email-pop .head{background:var(--ink);color:#fff;padding:10px 16px;font-size:11.5px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.email-pop .head .x{margin-left:auto;background:none;border:0;color:#fff;font-size:16px;opacity:.7}
.email-pop .body{padding:14px 16px}
.email-pop .subj{font-weight:700;font-size:14px;margin-bottom:4px}
.email-pop .meta{font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.email-pop .txt{font-size:13px;color:var(--ink-2)}

/* ---------- personal page ---------- */
.pp-shell{max-width:720px;margin:0 auto;padding:30px 20px 70px}
.pp-head{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.avatar{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none}
.av-mentor{background:linear-gradient(135deg,#C8102E,#8F0C20)}
.av-mentee{background:linear-gradient(135deg,#3A4150,#282D37)}
.pp-head h1{font-family:var(--display);font-size:24px;font-weight:800;margin:0;letter-spacing:-.5px}
.pp-head .sub{font-size:13px;color:var(--ink-2)}
.steps{display:flex;gap:0;margin:6px 0 24px;overflow-x:auto;padding-bottom:6px}
.step{flex:1;min-width:86px;text-align:center;position:relative}
.step::before{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--red)}
.step .dot{position:relative;width:21px;height:21px;margin:0 auto;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--ink-3)}
.step.done .dot{background:var(--red);border-color:var(--red);color:#fff}
.step.cur .dot{border-color:var(--red);color:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.15)}
.step span{display:block;font-size:10.5px;font-weight:650;color:var(--ink-3);margin-top:6px}
.step.done span,.step.cur span{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:9px}
.acklist{display:flex;flex-direction:column;gap:8px}
.ackrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;background:var(--surface-2)}
.ackrow .nm{font-size:13.5px;font-weight:650;flex:1}
.ackrow .ver{font-size:11px;color:var(--ink-3)}
.mentor-card{display:flex;gap:14px;align-items:flex-start;background:var(--ai-wash);border:1px solid var(--ai-line);border-radius:12px;padding:14px 16px}
.cert{background:linear-gradient(160deg,#FFFDF5,#FDF6E3);border:1.5px solid #E5D9A9;border-radius:14px;padding:28px;text-align:center}
.cert h2{font-family:var(--display);font-size:22px;margin:8px 0 4px;letter-spacing:-.4px}
.cert .nm{font-size:26px;font-weight:800;color:var(--red);margin:10px 0}
.cert .meta{font-size:12px;color:var(--ink-3)}

/* ---------- console ---------- */
.co-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.co-side{background:#1E222A;color:#AEB6C2;padding:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.co-brand{padding:18px;border-bottom:1px solid #343B46;color:#fff;font-weight:800;font-family:var(--display)}
.co-brand small{display:block;font-size:9px;letter-spacing:.16em;color:#7C8494;font-weight:700}
.co-nav{padding:10px;flex:1;overflow-y:auto}
.co-nav .lab{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#6B7280;font-weight:800;padding:10px 10px 4px}
.co-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 11px;border-radius:8px;border:0;background:transparent;color:#AEB6C2;font-size:13px;font-weight:600}
.co-item:hover{background:#272C36;color:#fff}
.co-item.on{background:var(--red);color:#fff}
.co-item .n{margin-left:auto;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.14);color:#fff;padding:1px 7px;border-radius:12px}
.co-user{padding:13px 16px;border-top:1px solid #343B46;font-size:12px}
.co-user b{color:#fff;display:block;font-size:13px}
.co-main{min-width:0;padding:26px 30px 70px;max-width:1100px}
.co-title{font-family:var(--display);font-size:23px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px}
.co-sub{color:var(--ink-2);font-size:13px;margin:0 0 20px;max-width:640px}
table.tb{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.tb th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tb td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.funnel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat .n{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:11px;color:var(--ink-3);font-weight:650;margin-top:2px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.ai-block{background:linear-gradient(180deg,var(--ai-wash),var(--surface) 70%);border:1px solid var(--ai-line);border-radius:10px;padding:11px 13px;font-size:12.5px;margin:10px 0}
.ai-block .t{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--ai-ink);text-transform:uppercase;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.pair-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);flex-wrap:wrap}
.pair-row .who{flex:1;min-width:230px}
.pair-row .who b{font-size:13.5px}
.pair-row .who .sub{font-size:11.5px;color:var(--ink-3)}
.why{width:100%;background:var(--ai-wash);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--ink-2)}
.why li{margin:2px 0}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#1E222A,#2A2F3A)}
.login-card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);padding:34px;width:420px;max-width:92vw}
.login-card h1{font-family:var(--display);font-size:20px;margin:0 0 4px}
.login-card .sub{font-size:12.5px;color:var(--ink-3);margin-bottom:18px}
.login-row{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:11px 14px;margin-bottom:8px;text-align:left}
.login-row:hover{border-color:var(--red)}
.login-row b{font-size:13.5px}
.login-row .r{font-size:11.5px;color:var(--ink-3)}
.sim-note{font-size:11px;color:var(--ink-3);text-align:center;margin-top:12px}

/* ---------- rpc busy bar ---------- */
.rpc-busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;background:linear-gradient(90deg,var(--red),#F5A623,var(--red));background-size:200% 100%;animation:busySlide 1s linear infinite}
@keyframes busySlide{from{background-position:0 0}to{background-position:200% 0}}

/* ---------- feedback ---------- */
.fb-btn{position:fixed;right:16px;bottom:16px;z-index:80;background:var(--red);color:#fff;border:0;border-radius:24px;
  padding:10px 18px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-lg)}
.fb-btn:hover{background:var(--red-deep)}
.fb-wrap{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:20px}
.fb-bg{position:absolute;inset:0;background:rgba(20,23,29,.55)}
.fb-modal{position:relative;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);padding:22px;width:440px;max-width:94vw}

/* ---------- open-as switcher ---------- */
.openas{position:fixed;left:16px;bottom:16px;z-index:80}
.openas-btn{background:var(--ink);color:#fff;border:0;border-radius:24px;padding:10px 18px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center}
.openas-menu{position:absolute;bottom:52px;left:0;width:330px;max-height:60vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:10px}
.openas-menu .sec{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink-3);padding:8px 10px 3px}
.openas-menu button{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:12.5px;text-align:left}
.openas-menu button:hover{background:var(--surface-2)}
.demo-banner{background:#FFF8E1;border-bottom:1px solid #F0E2B6;color:#6B5310;font-size:12px;font-weight:650;text-align:center;padding:7px 12px}
.demo-banner a{color:#6B5310;text-decoration:underline}

@media(max-width:900px){.cards3{grid-template-columns:1fr}.co-shell{grid-template-columns:1fr}
 .co-side{position:relative;height:auto}.funnel-grid{grid-template-columns:repeat(2,1fr)}
 .ms-hero h1{font-size:32px}.f-grid2{grid-template-columns:1fr}}

</style>

<script>
/* GRMP Demo — state engine + seeded cohort.
   Single source of truth in localStorage. Deterministic seed (mulberry32) so tests are stable.
   Demo date is fixed at 2026-12-15 (mid-cycle: R1 closed, R2 running) so every view has life. */

const DB_KEY = 'grmp_demo_v4';   // bumped: cohort model + accounts
const TODAY = '2026-12-15';

/* Node compatibility: same file runs headless for CLI backend tests (localStorage shim). */
if (typeof localStorage === 'undefined') {
  globalThis.__mem = {};
  globalThis.localStorage = {
    getItem: k => (k in globalThis.__mem ? globalThis.__mem[k] : null),
    setItem: (k,v) => { globalThis.__mem[k] = String(v); },
    removeItem: k => { delete globalThis.__mem[k]; },
  };
}

/* ---------- deterministic PRNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261215);
const pick = arr => arr[Math.floor(rnd()*arr.length)];
const pickN = (arr,n)=>{const c=[...arr],out=[];while(out.length<n&&c.length)out.push(c.splice(Math.floor(rnd()*c.length),1)[0]);return out};

/* ---------- name pools (SG mix) ---------- */
const FIRST = ['Wei Jie','Jun Kai','Zhi Hao','Kai Xin','Hui Ling','Mei Yi','Jia Hui','Yu Xuan','Zi Yang','Cheng Han','Xin Yi','Li Ting','Nur Aisyah','Siti Nurul','Muhammad Danish','Ahmad Irfan','Farah','Nadia','Arjun','Priya','Kavya','Rohan','Divya','Karthik','Meera','Rajiv','Daniel','Marcus','Chloe','Grace','Ryan','Sophie','Ethan','Rachel','Nicholas','Amanda','Bryan','Michelle','Isaac','Clara'];
const LAST  = ['Tan','Lim','Lee','Ng','Wong','Chua','Goh','Ong','Teo','Koh','Chen','Low','Ho','Yeo','Sim','Toh','Chan','Loh','Bin Rahman','Binte Hassan','Menon','Pillai','Nair','Sharma','Krishnan','Raj','Kumar','s/o Suresh'];
const uname = (used)=>{let n;do{n=pick(FIRST)+' '+pick(LAST)}while(used.has(n));used.add(n);return n};

/* ---------- track content pools ---------- */
const TRACKS = {
  general:        {label:'General',          industries:['Finance','Technology','Communications','Human Resources','Education','Healthcare','Consulting']},
  entrepreneurship:{label:'Entrepreneurship', industries:['Startups','Venture Building','E-commerce','Climate Tech','FoodTech']},
  ai:             {label:'AI',               industries:['AI Products','Data & ML','AI in Finance','AI in Marketing','AI Operations']},
};
const MENTOR_ORGS = {general:['DBS','OCBC','Grab','Singtel','Shopee','MOE','SPH Media','EDB','McKinsey','PwC','Sea Group','ST Engineering'],
  entrepreneurship:['GreenLoop (founder)','Carousell (early team)','own venture (2x founder)','Antler SG','Glife','Stealth startup'],
  ai:['TikTok','Google','Microsoft','AI Singapore','Databricks','OpenGov']};
const MENTOR_ROLES = {general:['Vice President','Director','Senior Manager','Head of Department','Partner','Regional Lead'],
  entrepreneurship:['Founder & CEO','Co-founder','Founding Partner','Venture Builder'],
  ai:['ML Engineering Lead','AI Product Manager','Head of Data Science','Applied AI Lead','Senior AI Engineer']};
const COURSES = ['Business Management','Accountancy','Economics','Information Systems','Computer Science','Law','Social Sciences','Psychology'];
const GOALS = {general:['clarify my career direction in my industry','build confidence for my first job search','learn how leaders think about career growth','navigate from school into the corporate world'],
  entrepreneurship:['test whether founding a startup suits me','learn how to validate and launch an idea','understand fundraising and early operations'],
  ai:['understand how AI is changing my target industry','build a career that combines my degree with AI skills','learn practical AI adoption from a practitioner']};
const DEVNEEDS = ['communication and presence','networking and building professional relationships','structured thinking and prioritisation','confidence and self-belief','industry knowledge and career mapping','leadership and taking initiative'];
const MOTIVES = ['give back to the next generation','share lessons I wish someone had told me earlier','stay connected with young perspectives','strengthen Singapore’s talent pipeline'];

/* ---------- seed builder ---------- */
function buildSeed(){
  const used = new Set();
  const people = [];
  let seq = 1;
  const mk = (kind, track, appStatus) => {
    const name = uname(used);
    const id = (kind==='mentor'?'M':'E') + String(seq++).padStart(3,'0');
    const ind = pick(TRACKS[track].industries);
    const p = {id, kind, track, name,
      email: name.toLowerCase().replace(/[^a-z ]/g,'').replace(/ +/g,'.') + (kind==='mentor'?'@example.com':'@smu.example.edu'),
      mobile: '+65 9'+String(100+Math.floor(rnd()*900))+' '+String(1000+Math.floor(rnd()*9000)),
      appStatus, submittedAt:'2026-08-'+String(20+Math.floor(rnd()*10)),
      ack:null, orientation:null, source:'form'};
    if(kind==='mentor'){
      Object.assign(p,{org:pick(MENTOR_ORGS[track]), role:pick(MENTOR_ROLES[track]), industry:ind,
        background:`${12+Math.floor(rnd()*18)} years in ${ind.toLowerCase()}`,
        leadership:pick(['leads a team of '+(4+Math.floor(rnd()*30)),'built and managed regional teams','mentored juniors throughout career']),
        xcultural:pick(['worked across SEA markets','led projects in 3+ countries','studied and worked overseas']),
        languages:pickN(['English','Mandarin','Malay','Tamil','Cantonese','Hindi'],1+Math.floor(rnd()*2)),
        motivation:pick(MOTIVES)});
    }else{
      Object.assign(p,{university:'SMU', course:pick(COURSES), year:String(2+Math.floor(rnd()*3)),
        goals:pick(GOALS[track]), devNeeds:pickN(DEVNEEDS,2).join('; '),
        industryInterest:ind, expectations:'a mentor who is honest, generous with stories, and challenges me',
        readiness:'I journal regularly and am ready to reflect after each meeting'});
    }
    people.push(p); return p;
  };

  // Mentors: 60 accepted (incl. 6 reserve bench) + 3 waitlist + 3 declined
  const mentors = [];
  const mtracks = [...Array(36).fill('general'),...Array(12).fill('entrepreneurship'),...Array(12).fill('ai')];
  mtracks.forEach(t=>mentors.push(mk('mentor',t,'accepted')));
  pickN(mentors,6).forEach(m=>m.appStatus='reserve_bench');
  for(let i=0;i<3;i++) mk('mentor',pick(['general','ai']),'waitlisted');
  for(let i=0;i<3;i++) mk('mentor','general','declined');

  // Mentees: 60 accepted + 8 waitlist + 4 declined + 2 fresh submitted (screening demo)
  const mentees = [];
  const etracks = [...Array(36).fill('general'),...Array(12).fill('entrepreneurship'),...Array(12).fill('ai')];
  etracks.forEach(t=>mentees.push(mk('mentee',t,'accepted')));
  for(let i=0;i<8;i++) mk('mentee',pick(['general','entrepreneurship','ai']),'waitlisted');
  for(let i=0;i<4;i++) mk('mentee',pick(['general','ai']),'declined');
  for(let i=0;i<2;i++) mk('mentee',pick(['general','ai']),'submitted');   // still in screening

  /* acknowledgement + orientation: all accepted done EXCEPT 2 late mentees (gate demo) */
  const DOCS = ['rules','charter','governance','pdpa','coi'];
  const lateAck = pickN(mentees.filter(e=>e.appStatus==='accepted'),2);
  people.filter(p=>['accepted','reserve_bench'].includes(p.appStatus)).forEach(p=>{
    if(lateAck.includes(p)){ p.ack = {rules:'2026-09-08'}; p.orientation=null; return; }   // partial ack, blocked
    p.ack = Object.fromEntries(DOCS.map(d=>[d,'2026-09-0'+(2+Math.floor(rnd()*7))]));
    p.orientation = {mode: rnd()<0.7?'live':'recorded', at:'2026-09-'+String(15+Math.floor(rnd()*10))};
  });

  /* reviews: every non-new applicant has 2 reviewer scores */
  const REVIEWERS = {mentor:['Esther','Wei Kiat','Kenzie','Yu Tong'], mentee:['Esther','Wei Kiat','Portia','Sapranshu']};
  const reviews = [];
  people.forEach(p=>{
    if(p.appStatus==='submitted') return;                     // fresh ones: not yet scored (live demo material)
    pickN(REVIEWERS[p.kind],2).forEach(r=>reviews.push({personId:p.id,reviewer:r,score:3+Math.floor(rnd()*3),comment:pick(['Strong fit','Thoughtful application','Clear goals','Good energy, some vagueness','Solid, keep an eye on commitment'])}));
  });

  /* pairs — R1 (closed) + R2 (running). Track-pure, ≤2 mentees/mentor, no repeat mentor. */
  const activeMentors = mentors.filter(m=>m.appStatus==='accepted');
  const activeMentees = mentees.filter(e=>e.appStatus==='accepted');
  const pairs=[]; let pid=1;
  const capUsed = {};                                          // rotation -> mentorId -> count
  const history = {};                                          // menteeId -> Set(mentorId)
  function pairUp(rotation, mentee, statusPlan){
    const cands = activeMentors.filter(m=>m.track===mentee.track
      && (capUsed[rotation]?.[m.id]||0) < 2
      && !(history[mentee.id]?.has(m.id)));
    if(!cands.length) return null;
    const mentor = cands[Math.floor(rnd()*cands.length)];
    capUsed[rotation]=capUsed[rotation]||{}; capUsed[rotation][mentor.id]=(capUsed[rotation][mentor.id]||0)+1;
    history[mentee.id]=history[mentee.id]||new Set(); history[mentee.id].add(mentor.id);
    const pr={id:'P'+String(pid++).padStart(3,'0'), rotation, mentorId:mentor.id, menteeId:mentee.id,
      status:statusPlan, approvedAt: rotation===1?'2026-09-28':'2026-11-30',
      rationale:[`Same track (${TRACKS[mentee.track].label}) and mentee's development needs match the mentor's background`,
                 `Mentee aims to ${mentee.goals}; mentor brings ${mentor.background}`,
                 `Capacity and no-repeat checks passed`]};
    pairs.push(pr); return pr;
  }
  // R1: everyone paired EXCEPT the gate-blocked (no acknowledgement → never matched, per the binding rule)
  const r1=[]; activeMentees.filter(e=>!lateAck.includes(e)).forEach(e=>{const p=pairUp(1,e,'approved'); if(p)r1.push(p)});
  const r1Missing = pickN(r1,3);
  r1.forEach(p=>{ if(!r1Missing.includes(p)){ p.status='closed';
      p.closeoff={metTwice:true,reflectionDone:true,at:'2026-11-'+String(25+Math.floor(rnd()*5)),comment:pick(['Great pairing.','Learned a lot.','We clicked well.',''])};}});
  // R2: most paired; 8 mentees left unmatched (live matching demo); 1 mentor dropout staged
  const unmatchedR2 = pickN(activeMentees.filter(e=>!lateAck.includes(e)),6).concat(lateAck); // 8 total, incl. 2 gate-blocked
  activeMentees.forEach(e=>{ if(!unmatchedR2.includes(e)) pairUp(2,e,'approved'); });
  // dropout: pick a mentor with 2 R2 pairs
  const byMentor={}; pairs.filter(p=>p.rotation===2).forEach(p=>{(byMentor[p.mentorId]=byMentor[p.mentorId]||[]).push(p)});
  const dropMentorId = Object.keys(byMentor).find(k=>byMentor[k].length===2) || Object.keys(byMentor)[0];
  const dropped = people.find(p=>p.id===dropMentorId);
  dropped.droppedOut = {at:'2026-12-10', reason:'work relocation'};
  byMentor[dropMentorId].forEach(p=>{p.status='rematch_needed'});

  /* fast-forward previews: 2 mentees with all 3 rotations closed (certificate/builder-reflection demo) */
  const preview = pickN(activeMentees.filter(e=>!unmatchedR2.includes(e)),2);
  preview.forEach(e=>{
    const pr2 = pairs.find(p=>p.rotation===2 && p.menteeId===e.id);
    if(pr2){pr2.status='closed'; pr2.closeoff={metTwice:true,reflectionDone:true,at:'2026-12-14',comment:''};}
    const p3=pairUp(3,e,'closed'); if(p3){p3.approvedAt='2027-02-01';p3.closeoff={metTwice:true,reflectionDone:true,at:'2027-03-10',comment:''};p3.preview=true;}
    e.previewFastForward = true;
  });

  /* events */
  const attendedKickoff = people.filter(p=>['accepted','reserve_bench'].includes(p.appStatus) && p.orientation).map(p=>p.id);
  const events = {
    kickoff:      {name:'Kickoff Night', date:'2026-10-03', attendance:pickN(attendedKickoff, Math.floor(attendedKickoff.length*0.9))},
    appreciation: {name:'Appreciation Night', date:'2027-03-27', attendance:[]},
  };

  /* concerns: 1 sample referral */
  const concerns = [{id:'C001', at:'2026-11-18', from:'(mentee — identity visible to Escalation Owner only)',
    summary:'Raised a concern about repeated last-minute cancellations', status:'referred to SMC Grievance process'}];

  /* email log (what would have been sent) */
  const emails = [
    {at:'2026-09-01', to:'all accepted', subject:'Welcome to GRMP 2026 — please acknowledge the Programme Rules', kind:'ack_notify'},
    {at:'2026-09-08', to:'12 outstanding', subject:'Reminder: acknowledgement outstanding', kind:'ack_remind'},
    {at:'2026-09-15', to:'4 outstanding', subject:'Final reminder: acknowledgement required to be matched', kind:'ack_final'},
    {at:'2026-09-28', to:'all matched pairs', subject:'Your Rotation 1 match — Know Yourself', kind:'match'},
    {at:'2026-11-25', to:'mentees', subject:'Rotation 1 close-off — two quick confirmations', kind:'closeoff'},
    {at:'2026-11-30', to:'all matched pairs', subject:'Your Rotation 2 match — Know Your World', kind:'match'},
  ];

  /* preset accounts: 6 admins + 5 participant personas (picked deterministically) */
  const DOCS5=['rules','charter','governance','pdpa','coi'];
  const acctGate = people.find(p=>p.kind==='mentee'&&p.appStatus==='accepted'&&!(p.ack&&DOCS5.every(k=>p.ack[k])));
  const acctFF   = people.find(p=>p.previewFastForward);
  const acctMid  = (pairs.find(x=>x.rotation===2&&x.status==='approved'&&!people.find(pp=>pp.id===x.menteeId).previewFastForward)||{}).menteeId;
  const acctMentor = (pairs.find(x=>x.rotation===2&&x.status==='approved')||{}).mentorId;
  const acctBench  = people.find(p=>p.appStatus==='reserve_bench');
  const accounts = [
    {u:'esther',   pass:'grmp2026', kind:'admin', name:'Esther',    label:'Programme Lead'},
    {u:'weikiat',  pass:'grmp2026', kind:'admin', name:'Wei Kiat',  label:'Programme Coordinator'},
    {u:'kenzie',   pass:'grmp2026', kind:'admin', name:'Kenzie',    label:'Mentor Reviewer (SMU)'},
    {u:'yutong',   pass:'grmp2026', kind:'admin', name:'Yu Tong',   label:'Mentor Reviewer (SMU)'},
    {u:'portia',   pass:'grmp2026', kind:'admin', name:'Portia',    label:'Mentee Reviewer (SMU)'},
    {u:'sapranshu',pass:'grmp2026', kind:'admin', name:'Sapranshu', label:'Mentee Reviewer (SMU)'},
    {u:'mentee.new',  pass:'grmp2026', kind:'person', personId:acctGate.id,  label:'Mentee — start of journey (gates ahead)'},
    {u:'mentee.mid',  pass:'grmp2026', kind:'person', personId:acctMid,      label:'Mentee — mid-cycle (close-off due)'},
    {u:'mentee.done', pass:'grmp2026', kind:'person', personId:acctFF.id,    label:'Mentee — end of journey (certificate path)'},
    {u:'mentor.active',pass:'grmp2026',kind:'person', personId:acctMentor,   label:'Mentor — active with mentees'},
    {u:'mentor.bench', pass:'grmp2026',kind:'person', personId:acctBench.id, label:'Mentor — reserve bench'},
  ];

  return {
    version:1, today:TODAY,
    archives:[], aiCache:{}, sessions:{},
    config:{
      cohort:{id:'C2026', label:'GRMP 2026 (SMU pilot)'},
      accounts,
      cycle:'GRMP 2026 (SMU pilot)',
      rotations:[{n:1,label:'Know Yourself',start:'2026-10-01',end:'2026-11-30'},
                 {n:2,label:'Know Your World',start:'2026-12-01',end:'2027-01-31'},
                 {n:3,label:'Know Your Path',start:'2027-02-01',end:'2027-03-31'}],
      ackLadder:[{week:'Sept W1',date:'2026-09-01',what:'Acknowledgement notification'},
                 {week:'Sept W2',date:'2026-09-08',what:'First reminder'},
                 {week:'Sept W3',date:'2026-09-15',what:'Final reminder'}],
      admins:[{name:'Esther', role:'Programme Lead', roles:['lead','mentor_reviewer','mentee_reviewer','escalation']},
              {name:'Wei Kiat', role:'Programme Coordinator', roles:['coordinator','mentor_reviewer','mentee_reviewer']},
              {name:'Kenzie', role:'Mentor Reviewer (SMU)', roles:['mentor_reviewer']},
              {name:'Yu Tong', role:'Mentor Reviewer (SMU)', roles:['mentor_reviewer','dashboard_viewer']},
              {name:'Portia', role:'Mentee Reviewer (SMU)', roles:['mentee_reviewer','dashboard_viewer']},
              {name:'Sapranshu', role:'Mentee Reviewer (SMU)', roles:['mentee_reviewer','dashboard_viewer']}],
      openItems:{
        Q1:{title:'Reflection Sheet lives on the microsite; system records close-offs only', inferred:true},
        Q2:{title:'Certificate after all 3 rotations (mentee: 3 close-offs + Builder Reflection; mentor: all rotations + mid-programme review)', inferred:true},
        Q3:{title:'One track per mentee; matching strictly within track; priority = development-need fit → industry → diversity', inferred:true},
        Q4:{title:'Form fields follow Working Design §3 until Joanne’s final form arrives', inferred:true},
        Q5:{title:'No acknowledgement after the final reminder → treated as withdrawn, seat freed', inferred:true},
        Q6:{title:'Concern link on microsite + acknowledgement page; Esther is sole recipient', inferred:true},
        Q7:{title:'Lean scope: no pair/meeting/availability tracking, no kickoff-goals form, no reflection content stored', inferred:true},
        Q8:{title:'Placeholder dates: registration early Sept · Kickoff early Oct · microsite live before registration', inferred:true},
      },
    },
    people, reviews, pairs, events, concerns, emails,
    midreviews:[], builderReflections:[], certificates:[], audit:[],
  };
}

/* ---------- store API ---------- */
const Store = {
  load(){
    try{ const raw = localStorage.getItem(DB_KEY); if(raw){ const db=JSON.parse(raw); if(db.version===1) return db; } }catch(e){}
    const db = buildSeed(); localStorage.setItem(DB_KEY, JSON.stringify(db)); return db;
  },
  save(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); },
  reset(){ localStorage.removeItem(DB_KEY); return Store.load(); },
};

/* ---------- domain helpers (shared by views + tests) ---------- */
const D = {
  person:(db,id)=>db.people.find(p=>p.id===id),
  mentors:db=>db.people.filter(p=>p.kind==='mentor'),
  mentees:db=>db.people.filter(p=>p.kind==='mentee'),
  ackComplete:p=>p.ack && ['rules','charter','governance','pdpa','coi'].every(d=>p.ack[d]),
  gateBlocked:p=>['accepted'].includes(p.appStatus) && !(D.ackComplete(p) && p.orientation),
  currentRotation:db=>{const t=db.today;return db.config.rotations.find(r=>t>=r.start&&t<=r.end)||null},
  pairsFor:(db,personId)=>db.pairs.filter(p=>p.mentorId===personId||p.menteeId===personId),
  capacityLeft:(db,mentorId,rotation)=>2 - db.pairs.filter(p=>p.rotation===rotation&&p.mentorId===mentorId&&p.status!=='rejected').length,
  repeatMentor:(db,menteeId,mentorId)=>db.pairs.some(p=>p.menteeId===menteeId&&p.mentorId===mentorId&&p.status!=='rejected'),
  menteeCloseoffs:(db,menteeId)=>db.pairs.filter(p=>p.menteeId===menteeId&&p.status==='closed'&&p.closeoff),
  certEligible:(db,p)=>{
    if(p.kind==='mentee'){
      return D.menteeCloseoffs(db,p.id).length>=3 && db.builderReflections.some(b=>b.menteeId===p.id);
    }
    const served = db.pairs.some(x=>x.mentorId===p.id&&['approved','closed'].includes(x.status));
    const earlyServed = db.pairs.some(x=>x.mentorId===p.id&&x.rotation<=2&&['approved','closed','replaced'].includes(x.status));
    return served && (!earlyServed || db.midreviews.some(m=>m.mentorId===p.id));
  },
  aiSummary:p=>{                                   // simulated AI output, clearly labelled in UI
    if(p.kind==='mentor')
      return `${p.role} at ${p.org} (${p.background}). ${p.xcultural}; ${p.leadership}. Track: ${p.track}. Motivation: ${p.motivation}. No flags.`;
    return `${p.university} ${p.course}, year ${p.year}. Goal: ${p.goals}. Development needs: ${p.devNeeds}. Track: ${p.track}. Ready to reflect. No flags.`;
  },
  aiRationale:(mentor,mentee)=>[
    `Same ${TRACKS[mentee.track].label} track; mentee's needs (${mentee.devNeeds.split(';')[0].trim()}) match the mentor's strengths`,
    `Mentee aims to ${mentee.goals}; mentor offers ${mentor.background} at ${mentor.org}`,
    `Constraint checks passed: capacity, no conflict, no repeat mentor`,
  ],
  /* actions (all mutations go through here — the demo's "backend") */
  submitApplication(db, kind, fields){
    const required = kind==='mentee' ? ['name','email','track','course','goals','consent'] : ['name','email','track','org','role','consent'];
    const missing = required.filter(k=>!fields[k]);
    const id=(kind==='mentor'?'M':'E')+String(900+db.people.filter(p=>p.id[0]===(kind==='mentor'?'M':'E')).length);
    const p={id,kind,track:fields.track||null,name:fields.name||'(no name)',email:fields.email||'',mobile:fields.mobile||'',
      appStatus:missing.length?'incomplete':'submitted',submittedAt:db.today,ack:null,orientation:null,source:'form',...fields};
    db.people.push(p);
    db.emails.push({at:db.today,to:p.email||'(applicant)',kind:missing.length?'missing_info':'confirm',
      subject:missing.length?`Your GRMP application is missing: ${missing.join(', ')}`:`GRMP: application received — thank you, ${p.name}`});
    db.audit.push({at:db.today,actor:'system',action:missing.length?'application_incomplete':'application_submitted',entity:id});
    return {person:p,missing};
  },
  score(db, personId, reviewer, score, comment){
    db.reviews.push({personId,reviewer,score,comment});
    db.audit.push({at:db.today,actor:reviewer,action:'scored',entity:personId});
  },
  decide(db, personId, decision, actor){
    const p=D.person(db,personId); p.appStatus=decision;
    const subj={accepted:'You’re in! Next: acknowledge the Programme Rules',reserve_bench:'You’re on our mentor reserve bench',
      waitlisted:'GRMP: you’re on the waitlist',declined:'GRMP: application outcome'}[decision];
    db.emails.push({at:db.today,to:p.email,kind:'decision',subject:subj});
    db.audit.push({at:db.today,actor,action:'decision:'+decision,entity:personId});
  },
  acknowledge(db, personId, docKey){
    const p=D.person(db,personId); p.ack=p.ack||{}; p.ack[docKey]=db.today;
    db.audit.push({at:db.today,actor:personId,action:'acknowledged:'+docKey,entity:personId});
  },
  completeOrientation(db, personId, mode){
    const p=D.person(db,personId); p.orientation={mode,at:db.today};
    db.audit.push({at:db.today,actor:personId,action:'orientation:'+mode,entity:personId});
  },
  suggestMatches(db, rotation, track){
    const mentees=db.people.filter(p=>p.kind==='mentee'&&p.appStatus==='accepted'&&p.track===track
      && !D.gateBlocked(p) && !db.pairs.some(x=>x.rotation===rotation&&x.menteeId===p.id&&['proposed','approved','closed'].includes(x.status)));
    const out=[];
    mentees.forEach(e=>{
      const cands=db.people.filter(m=>m.kind==='mentor'&&['accepted'].includes(m.appStatus)&&!m.droppedOut&&m.track===track
        && D.capacityLeft(db,m.id,rotation)>0 && !D.repeatMentor(db,e.id,m.id));
      if(cands.length){
        const m=cands[0];
        const pr={id:'P'+String(db.pairs.length+1).padStart(3,'0'),rotation,mentorId:m.id,menteeId:e.id,
          status:'proposed',rationale:D.aiRationale(m,e)};
        db.pairs.push(pr); out.push(pr);
      }
    });
    db.audit.push({at:db.today,actor:'AI',action:`suggested ${out.length} pairs (R${rotation}/${track})`,entity:'matching'});
    return out;
  },
  approvePair(db, pairId, actor){
    const pr=db.pairs.find(p=>p.id===pairId); pr.status='approved'; pr.approvedAt=db.today;
    const m=D.person(db,pr.mentorId), e=D.person(db,pr.menteeId);
    db.emails.push({at:db.today,to:`${m.email}, ${e.email}`,kind:'match',subject:`Your Rotation ${pr.rotation} match: ${m.name} ↔ ${e.name}`});
    db.audit.push({at:db.today,actor,action:'pair_approved',entity:pairId});
  },
  closeoff(db, pairId, metTwice, reflectionDone, comment){
    const pr=db.pairs.find(p=>p.id===pairId);
    pr.status='closed'; pr.closeoff={metTwice,reflectionDone,comment:comment||'',at:db.today};
    db.audit.push({at:db.today,actor:pr.menteeId,action:'closeoff',entity:pairId});
  },
  submitMidReview(db, mentorId, text){
    db.midreviews.push({mentorId,text,at:db.today});
    db.audit.push({at:db.today,actor:mentorId,action:'mid_review',entity:mentorId});
  },
  submitBuilderReflection(db, menteeId, text){
    db.builderReflections.push({menteeId,text,at:db.today});
    db.audit.push({at:db.today,actor:menteeId,action:'builder_reflection',entity:menteeId});
  },
  issueCertificates(db, actor){
    const issued=[];
    db.people.filter(p=>['accepted','reserve_bench'].includes(p.appStatus)).forEach(p=>{
      if(D.certEligible(db,p) && !db.certificates.some(c=>c.personId===p.id)){
        db.certificates.push({personId:p.id,at:db.today}); issued.push(p);
        db.emails.push({at:db.today,to:p.email,kind:'certificate',subject:`Your GRMP 2026 completion certificate, ${p.name}`});
      }
    });
    db.audit.push({at:db.today,actor,action:`certificates_issued:${issued.length}`,entity:'certificates'});
    return issued;
  },
  promoteWaitlist(db, personId, actor){
    const p=D.person(db,personId); p.appStatus='accepted';
    db.emails.push({at:db.today,to:p.email,kind:'decision',subject:'Good news — a place has opened up for you in GRMP'});
    db.audit.push({at:db.today,actor,action:'waitlist_promoted',entity:personId});
  },
  replaceMentor(db, pairId, benchMentorId, actor){
    const old=db.pairs.find(p=>p.id===pairId);
    const bench=D.person(db,benchMentorId); bench.appStatus='accepted';
    const pr={id:'P'+String(db.pairs.length+1).padStart(3,'0'),rotation:old.rotation,mentorId:benchMentorId,menteeId:old.menteeId,
      status:'approved',approvedAt:db.today,rationale:['Reserve-bench replacement after mentor dropout',...D.aiRationale(bench,D.person(db,old.menteeId)).slice(0,1)]};
    old.status='replaced';
    db.pairs.push(pr);
    const e=D.person(db,old.menteeId);
    db.emails.push({at:db.today,to:e.email,kind:'match',subject:`Your new mentor for Rotation ${old.rotation}: ${bench.name}`});
    db.audit.push({at:db.today,actor,action:'mentor_replaced',entity:pairId});
    return pr;
  },
  toggleAttendance(db, eventKey, personId){
    const ev = db.events[eventKey]; if(!ev) return;
    const i = ev.attendance.indexOf(personId);
    if(i>=0) ev.attendance.splice(i,1); else ev.attendance.push(personId);
    db.audit.push({at:db.today,actor:'coordinator',action:'attendance:'+eventKey,entity:personId});
  },
  remindCloseoff(db, email){
    db.emails.push({at:db.today,to:email,kind:'closeoff',subject:'Reminder: please close off your rotation (two quick confirmations)'});
  },
  confirmReturn(db, personId){
    const p = D.person(db, personId);
    if(!p || p.appStatus!=='invited') return false;
    p.appStatus='accepted';
    db.emails.push({at:db.today,to:p.email,kind:'decision',subject:`Welcome back to ${db.config.cohort.label}, ${p.name}!`});
    db.audit.push({at:db.today,actor:personId,action:'returning_mentor_confirmed',entity:personId});
    return true;
  },
  startNewCycle(db, opts){
    // opts: {label, rotations:[{n,label,start,end}x3], ackLadder?, today, actor, carryOverMentors=true}
    const old = db.config.cohort;
    const closed = n=>db.pairs.filter(x=>x.rotation===n&&x.status==='closed').length;
    db.archives.push({id:old.id, label:old.label, archivedAt:db.today,
      stats:{mentors:db.people.filter(p=>p.kind==='mentor'&&['accepted','reserve_bench'].includes(p.appStatus)).length,
             mentees:db.people.filter(p=>p.kind==='mentee'&&p.appStatus==='accepted').length,
             r1:closed(1), r2:closed(2), r3:closed(3),
             certificates:db.certificates.length,
             kickoff:db.events.kickoff.attendance.length}});
    const carry = opts.carryOverMentors!==false;
    const keep = carry ? db.people.filter(p=>p.kind==='mentor'&&['accepted','reserve_bench'].includes(p.appStatus)) : [];
    keep.forEach(m=>{ m.appStatus='invited'; m.ack=null; m.orientation=null; delete m.droppedOut; });
    db.people = keep;
    db.reviews=[]; db.pairs=[]; db.midreviews=[]; db.builderReflections=[]; db.certificates=[]; db.concerns=[];
    db.emails=[{at:opts.today,to:carry?keep.length+' returning mentors':'—',kind:'decision',
      subject:`${opts.label}: invitation to return as a mentor`}];
    const newId = 'C'+(opts.rotations[0].start||'').slice(0,4);
    db.events = {kickoff:{name:'Kickoff Night', date:opts.kickoffDate||opts.rotations[0].start, attendance:[]},
                 appreciation:{name:'Appreciation Night', date:opts.appreciationDate||opts.rotations[2].end, attendance:[]}};
    db.config.cohort = {id:newId, label:opts.label};
    db.config.cycle = opts.label;
    db.config.rotations = opts.rotations;
    if(opts.ackLadder) db.config.ackLadder = opts.ackLadder;
    db.today = opts.today;
    db.audit.push({at:opts.today,actor:opts.actor||'lead',action:'new_cycle_started:'+newId+' (archived '+old.id+')',entity:'config'});
    return newId;
  },
  setToday(db, dateStr){
    db.today = dateStr;
    db.audit.push({at:dateStr,actor:'demo',action:'clock_set:'+dateStr,entity:'config'});
  },
  raiseConcern(db, summary){
    const c={id:'C'+String(db.concerns.length+1).padStart(3,'0'),at:db.today,from:'(identity visible to Escalation Owner only)',
      summary,status:'referred to SMC Grievance process'};
    db.concerns.push(c);
    db.audit.push({at:db.today,actor:'(private)',action:'concern_referred',entity:c.id});
    return c;
  },
};

<script>
/* GRMP Demo — live AI layer (Gemini free tier), with graceful degradation.
   Design: pages render instantly with the simulated text, then upgrade in place
   when Gemini responds. Any failure (timeout / quota / offline) silently keeps
   the simulated version — the demo can never break because of the AI.
   The key is a free-tier demo key by deliberate choice; responses are cached
   per browser so each summary is generated once. Automated test runs
   (navigator.webdriver) skip live calls entirely. */

const AI = {
  key: 'AIzaSyB6OATmFTq1xAZvkAqA1Ch_FJUQHNSoFsw',
  model: 'gemini-flash-latest',
  enabled: (typeof navigator!=='undefined' && !navigator.webdriver),
  cache: (()=>{ try{ return JSON.parse(localStorage.getItem('grmp_ai_cache')||'{}'); }catch(e){ return {}; } })(),

  async gen(id, prompt){
    if(this.cache[id]) return this.cache[id];
    if(!this.enabled) return null;
    if(typeof google!=='undefined' && google.script && google.script.run){
      try{
        const txt = await new Promise((res,rej)=>google.script.run
          .withSuccessHandler(res).withFailureHandler(rej)
          .aiGen((window.SESSION_TOKEN_FN&&window.SESSION_TOKEN_FN())||null, id, prompt));
        if(txt){ this.cache[id]=txt; try{localStorage.setItem('grmp_ai_cache',JSON.stringify(this.cache));}catch(e){} }
        return txt||null;
      }catch(e){ return null; }
    }
    try{
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 10000);
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${this.model}:generateContent`, {
        method:'POST',
        headers:{'Content-Type':'application/json','X-goog-api-key':this.key},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}]}),
        signal:ctl.signal});
      clearTimeout(t);
      if(!r.ok) return null;
      const j = await r.json();
      const txt = ((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||'').join('').trim();
      if(!txt) return null;
      this.cache[id]=txt;
      try{ localStorage.setItem('grmp_ai_cache', JSON.stringify(this.cache)); }catch(e){}
      return txt;
    }catch(e){ return null; }
  },

  summaryPrompt(p){
    const data = p.kind==='mentor'
      ? {role:p.role, organisation:p.org, industry:p.industry, background:p.background,
         leadership:p.leadership, crossCultural:p.xcultural, languages:p.languages,
         motivation:p.motivation, track:p.track}
      : {university:p.university, course:p.course, year:p.year, goals:p.goals,
         developmentNeeds:p.devNeeds, industryInterest:p.industryInterest,
         expectations:p.expectations, readinessToReflect:p.readiness, track:p.track};
    return `You are assisting volunteer reviewers of GRMP, a Singapore mentorship programme.
Summarise this ${p.kind} application in 3 short factual sentences a busy reviewer can scan.
Do NOT recommend accepting or rejecting. No greetings, no markdown, plain text only.
Application data: ${JSON.stringify(data)}`;
  },

  rationalePrompt(mentor, mentee){
    return `A Singapore mentorship programme pairs mentees with mentors inside the same track.
In exactly 3 short plain-language lines (one reason per line, no markdown, no numbering),
explain why this pairing could work well. Be specific to the data.
Mentee: ${JSON.stringify({course:mentee.course, year:mentee.year, goals:mentee.goals, needs:mentee.devNeeds, industryInterest:mentee.industryInterest, track:mentee.track})}
Mentor: ${JSON.stringify({role:mentor.role, organisation:mentor.org, industry:mentor.industry, background:mentor.background, motivation:mentor.motivation, track:mentor.track})}`;
  },
};
if (typeof window!=='undefined') window.AI = AI;

</script>

    <p class="lede">The full manual (also the build spec and test script) ships in the repository:
      <b>USER_MANUAL.md</b>. Chapters: 1 Microsite · 2 Mentee · 3 Mentor · 4 Reviewer · 5 Programme Lead ·
      6 Coordinator · 7 Escalation Owner · 8 Admin.</p>
    <p><a href="USER_MANUAL.md" target="_blank" rel="noopener">Open the manual ↗</a></p>
  </div>` + this.msFooter();
},

/* ---------- changelog (acceptance loop, public) ---------- */
changelog(){
  setTimeout(async ()=>{
    const box = document.getElementById('cl-body');
    if(!box) return;
    const url = (typeof FEEDBACK_URL!=='undefined') && FEEDBACK_URL;
    if(!url){ box.innerHTML = '<p style="color:var(--ink-3)">The feedback channel is being connected — check back shortly.</p>'; return; }
    try{
      const r = await fetch(url+'?list=1'); const j = await r.json();
      j.items = (j.items||[]).filter(it=>!String(it.page||'').startsWith('DECISION:'));
      if(!j.ok || !j.items.length){ box.innerHTML='<p style="color:var(--ink-3)">No feedback yet — be the first: every screen has a 💬 Feedback button.</p>'; return; }
      const chip = s => s==='fixed' ? '<span class="badge b-ok"><span class="d"></span>Fixed</span>'
        : s==='in_progress' ? '<span class="badge b-warn"><span class="d"></span>In progress</span>'
        : s==='wont_fix' ? '<span class="badge b-neut"><span class="d"></span>Not planned</span>'
        : '<span class="badge b-ai">New</span>';
      box.innerHTML = j.items.map(it=>`<div class="doc-card" style="padding:14px 18px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${chip(it.status)}
          <b style="font-size:13px">${it.author&&it.author!=='anonymous'?it.author:'Someone'}</b>
          <span style="font-size:11.5px;color:var(--ink-3)">${it.ts} · on ${it.page} · as ${it.role}</span></div>
        <p style="font-size:13.5px;margin:8px 0 0">${it.text}</p>
        ${it.note?`<p style="font-size:12.5px;margin:8px 0 0;color:var(--ok);background:var(--ok-wash);border-radius:8px;padding:8px 12px"><b>Build team:</b> ${it.note}${it.resolvedAt?' · '+it.resolvedAt:''}</p>`:''}
      </div>`).join('');
    }catch(e){ box.innerHTML='<p style="color:var(--ink-3)">Could not load right now — refresh in a minute.</p>'; }
  }, 50);
  return this.msNav() + `<div class="doc-page">
    <h1>Changelog — your feedback, our fixes</h1>
    <p class="lede">Every screen has a 💬 Feedback button. What you send lands here with a status; small fixes usually ship within a day.</p>
    <div id="cl-body"><p style="color:var(--ink-3)">Loading…</p></div>
  </div>` + this.msFooter();
},

/* ---------- decisions register (replaces the Round 2 sheet) ---------- */
decisions(){
  setTimeout(async ()=>{
    await loadDecisions();
    const box=document.getElementById('dc-body'); if(!box) return;
    const items = Object.entries(__demo.db.config.openItems).map(([q,it])=>{
      const dec = decisionCache && decisionCache[q];
      const chip = dec ? (dec.kind==='confirm'
        ? `<span class="badge b-ok"><span class="d"></span>Confirmed · ${dec.author} · ${dec.ts}</span>`
        : `<span class="badge b-warn"><span class="d"></span>Change requested · ${dec.author}</span>`)
        : '<span class="badge b-ai">Awaiting confirmation</span>';
      return `<div class="doc-card" style="padding:14px 18px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>${q}</b>${chip}</div>
        <p style="font-size:13.5px;margin:6px 0 0">${it.title}</p>
        ${dec&&dec.kind==='change'?`<p style="font-size:12.5px;margin:6px 0 0;color:var(--warn)">Requested: “${dec.text}”</p>`:''}
      </div>`;
    }).join('');
    box.innerHTML = items;
  },50);
  return this.msNav() + `<div class="doc-page">
    <h1>Decisions register</h1>
    <p class="lede">The eight inferred defaults running in this system. Confirm or request a change right where you see each yellow card — Q1 and Q2 are Esther's calls. This register replaces the Round-2 sheet.</p>
    <div id="dc-body"><p style="color:var(--ink-3)">Loading…</p></div>
  </div>` + this.msFooter();
},

/* ---------- 2/3 personal pages ---------- */
personal(personId){
  const db = __demo.db, D = GRMP.D;
  const p = D.person(db, personId);
  if(!p) return this.landing();
  const mentee = p.kind==='mentee';
  const ackDone = D.ackComplete(p);
  const rotNow = D.currentRotation(db);
  const myPairs = D.pairsFor(db, personId).filter(x=>['approved','closed','rematch_needed','replaced'].includes(x.status));
  const closed = mentee ? D.menteeCloseoffs(db, personId).length : null;
  const hasBR = db.builderReflections.some(b=>b.menteeId===personId);
  const hasMR = db.midreviews.some(m=>m.mentorId===personId);
  const cert = db.certificates.some(c=>c.personId===personId);
  const eligible = D.certEligible(db, p);

  /* timeline model */
  const steps = mentee
    ? [['Applied',true],['Accepted',['accepted','reserve_bench'].includes(p.appStatus)],['Acknowledged',ackDone],
       ['Orientation',!!p.orientation],['R1',closed>=1],['R2',closed>=2],['R3',closed>=3],
       ['Builder Reflection',hasBR],['Certificate',cert||eligible]]
    : [['Registered',true],['Accepted',['accepted','reserve_bench'].includes(p.appStatus)],['Acknowledged',ackDone],
       ['Orientation',!!p.orientation],['Matched',myPairs.length>0],['Mid-programme review',hasMR],['Certificate',cert||eligible]];
  let curIdx = steps.findIndex(s=>!s[1]); if(curIdx<0) curIdx = steps.length-1;

  /* --- next-step card --- */
  let nextCard = '';
  if(p.appStatus==='invited'){
    nextCard = `<div class="card"><h3>👋 Welcome back — ${esc(db.config.cohort.label)}</h3>
      <p style="font-size:13px;color:var(--ink-2)">You mentored in a previous cycle and the programme team has invited you to return.
      Confirm below — then re-acknowledge the programme documents (they may have changed) and complete this cycle's orientation.</p>
      <button class="btn btn-primary" data-act="confirmReturn" data-person="${p.id}">Yes — I'm returning as a mentor</button></div>`;
    return `<div class="pp-shell">
      <div class="pp-head">
        <div class="avatar av-mentor">${esc(p.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
        <div><h1>Hi ${esc(p.name.split(' ')[0])}</h1>
          <div class="sub">Returning mentor · ${esc(GRMP.TRACKS[p.track].label)} track · ${esc(db.config.cohort.label)}</div></div>
      </div>
      ${nextCard}
    </div>`;
  }
  const DOCS = [['rules','GRMP Programme Rules','v2.0'],['charter','SMC Charter','v1.3'],['governance','Governance Guidelines','v1.1'],['pdpa','PDPA Consent','v1.0'],['coi','Conflict-of-Interest Declaration','v1.0']];
  if(!ackDone){
    nextCard = `<div class="card"><h3>📄 Acknowledge the programme documents</h3>
      <p style="font-size:13px;color:var(--ink-2)">Five documents, each recorded with a timestamp and version.
      <b>You can't be matched until all five are done.</b></p>
      <div class="acklist">${DOCS.map(([k,nm,ver])=>{
        const done = p.ack && p.ack[k];
        return `<div class="ackrow"><span class="nm">${nm}</span><span class="ver">${ver}</span>
          ${done?`<span class="badge b-ok"><span class="d"></span>Acknowledged ${done}</span>`
                :`<button class="btn sm btn-primary" data-act="ack" data-person="${p.id}" data-doc="${k}">Read & acknowledge</button>`}</div>`;
      }).join('')}</div>
      ${inferred('Q5')}
      <div style="margin-top:10px"><button class="btn sm btn-ghost" data-act="ackAll" data-person="${p.id}">Acknowledge all (demo shortcut)</button></div></div>`;
  } else if(!p.orientation){
    nextCard = `<div class="card"><h3>🎓 Complete your orientation</h3>
      <p style="font-size:13px;color:var(--ink-2)">Attend the live session, or watch the recorded module —
      <b>required before Rotation 1, no exceptions.</b></p>
      <div style="background:#14171d;border-radius:12px;aspect-ratio:16/7;display:grid;place-items:center;margin:4px 0 10px;cursor:pointer" data-act="orient" data-person="${p.id}" data-mode="recorded" role="button" tabindex="0" aria-label="Play orientation recording">
        <div style="text-align:center;color:#fff"><div style="width:54px;height:54px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin:0 auto 8px;font-size:20px">▶</div>
        <div style="font-size:13px;font-weight:700">GRMP Orientation 2026 — session recording</div>
        <div style="font-size:11px;opacity:.7">sent to everyone after the live session · opening it records your completion</div></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" data-act="orient" data-person="${p.id}" data-mode="recorded">▶ Watch recorded module (marks complete)</button>
        <span class="badge b-neut" style="align-self:center">live attendance is marked by the coordinator (Events)</span>
      </div></div>`;
  } else if(mentee){
    const openPair = myPairs.find(x=>x.status==='approved' && x.rotation===(rotNow?rotNow.n:2));
    const needRematch = myPairs.find(x=>x.status==='rematch_needed');
    if(needRematch){
      nextCard = `<div class="card"><h3>⏳ Your mentor changed jobs — replacement on the way</h3>
        <p style="font-size:13px;color:var(--ink-2)">Your Rotation ${needRematch.rotation} mentor had to step away.
        The coordinator is arranging a reserve-bench mentor within 7 days; you'll get a hand-over email.</p></div>`;
    } else if(openPair){
      const rotEnded = rotNow && db.today >= rotNow.end;
      nextCard = `<div class="card"><h3>✅ Close off Rotation ${openPair.rotation} (one minute)</h3>
        <p style="font-size:13px;color:var(--ink-2)">At the end of the rotation, confirm two things. The platform tracks nothing else about your meetings — it's on the two of you.</p>
        <label class="f-check" style="margin:8px 0"><input type="checkbox" id="co-met"><span>We met at least <b>twice</b> this rotation</span></label>
        <label class="f-check" style="margin:8px 0"><input type="checkbox" id="co-ref"><span>I completed my private reflection</span></label>
        <div style="font-size:11.5px;color:var(--ink-3);margin:-4px 0 8px 26px"><a href="#/reflection">Open the Reflection Sheet ↗</a></div>
        <div class="f-row"><input type="text" id="co-comment" placeholder="Optional comment"></div>
        <button class="btn btn-primary" data-act="closeoff" data-pair="${openPair.id}">Submit close-off</button>
        ${rotEnded?'':`<p style="font-size:11.5px;color:var(--ink-3);margin:8px 0 0">Rotation ${openPair.rotation} runs until ${rotNow.end} — in the demo you can close off early.</p>`}</div>`;
    } else if(closed>=3 && !hasBR){
      nextCard = `<div class="card"><h3>🏗 Your Builder Reflection</h3>
        <p style="font-size:13px;color:var(--ink-2)">You've completed all three rotations. Close the programme with a free-text
        reflection: how will you contribute back to the ecosystem that mentored you?</p>
        <div class="f-row"><textarea id="br-text" placeholder="Write freely — there are no categories to pick (deferred to Cycle 2)"></textarea></div>
        <button class="btn btn-primary" data-act="builder" data-person="${p.id}">Submit Builder Reflection</button></div>`;
    } else if(eligible && !cert){
      nextCard = `<div class="card"><h3>🎉 You qualify for your certificate</h3>
        <p style="font-size:13px;color:var(--ink-2)">All three rotations closed + Builder Reflection submitted.
        The Programme Lead issues certificates from the console — yours will arrive by email.</p></div>`;
    } else if(!myPairs.length){
      nextCard = `<div class="card"><h3>🤝 Matching in progress</h3>
        <p style="font-size:13px;color:var(--ink-2)">You're cleared (acknowledged + orientated). The programme team is preparing
        Rotation ${rotNow?rotNow.n:2} matches — you'll get one email with your mentor, the dates and the guide.</p></div>`;
    }
  } else {                                     /* mentor next-steps */
    const servedEarly = GRMP.D.pairsFor(db,personId).some(x=>x.rotation<=2 && x.status!=='rejected');
    if(!hasMR && servedEarly){
      nextCard = `<div class="card"><h3>📝 Mid-programme review (your one checkpoint)</h3>
        <p style="font-size:13px;color:var(--ink-2)">Two minutes in January: how is the pairing going, anything the team should know?
        (The demo lets you submit early.)</p>
        <div class="f-row"><textarea id="mr-text" placeholder="How is it going with your mentee(s)?"></textarea></div>
        <button class="btn btn-primary" data-act="midreview" data-person="${p.id}">Submit review</button></div>`;
    }
  }

  /* --- pairs display --- */
  const pairCards = myPairs.filter(x=>x.status!=='replaced').map(x=>{
    const other = D.person(db, mentee? x.mentorId : x.menteeId);
    const rot = db.config.rotations.find(r=>r.n===x.rotation);
    return `<div class="card"><h3>Rotation ${x.rotation} — ${rot.label}
        ${x.status==='closed'?'<span class="badge b-ok"><span class="d"></span>Closed off</span>'
          : x.status==='rematch_needed'?'<span class="badge b-warn"><span class="d"></span>Replacement pending</span>'
          : '<span class="badge b-neut"><span class="d"></span>Running · Dec–Jan</span>'}</h3>
      <div class="mentor-card">
        <div class="avatar ${mentee?'av-mentor':'av-mentee'}" style="width:44px;height:44px;font-size:14px">${esc(other.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
        <div style="flex:1">
          <b>${esc(other.name)}</b> <span class="track-chip track-${other.track}">${esc(GRMP.TRACKS[other.track].label)}</span>
          <div style="font-size:12.5px;color:var(--ink-2)">${mentee?esc(other.role+' · '+other.org):esc(other.university+' · '+other.course+', year '+other.year)}</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:3px">${mentee?esc('Background: '+other.background):esc('Goal: '+other.goals)}</div>
        </div></div>
      ${x.status==='closed'&&x.closeoff&&x.closeoff.comment&&mentee?`<div style="margin-top:10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;font-size:12.5px"><b style="color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em">Your close-off note</b><br>“${esc(x.closeoff.comment)}”</div>`:''}
      <p style="font-size:12px;color:var(--ink-3);margin:10px 0 0">Guide: <a href="#/reflection">${rot.label} — reflection prompts</a> · suggested first step: a 30-minute intro call.</p>
    </div>`;
  }).join('');

  const myBR = db.builderReflections.find(b=>b.menteeId===personId);
  const myMR = db.midreviews.find(m=>m.mentorId===personId);
  const brCard = (mentee&&myBR)?`<div class="card"><h3>🏗 Your Builder Reflection <span class="badge b-ok"><span class="d"></span>submitted ${myBR.at}</span></h3>
      <p style="font-size:13.5px;margin:0">“${esc(myBR.text)}”</p></div>`:'';
  const mrCard = (!mentee&&myMR)?`<div class="card"><h3>📝 Your mid-programme review <span class="badge b-ok"><span class="d"></span>submitted ${myMR.at}</span></h3>
      <p style="font-size:13.5px;margin:0">“${esc(myMR.text)}”</p></div>`:'';
  const certCard = cert ? `<div class="cert"><div style="font-size:11px;letter-spacing:.18em;font-weight:800;color:var(--gold)">SINGAPORE MENTORSHIP COMMITTEE</div>
      <h2>Certificate of Completion</h2><div class="nm">${esc(p.name)}</div>
      <div class="meta">Global Ready Mentorship Programme 2026 · all three rotations completed · issued ${esc(db.certificates.find(c=>c.personId===p.id).at)}</div></div>` : '';

  return `<div class="pp-shell">
    <div class="pp-head">
      <div class="avatar ${mentee?'av-mentee':'av-mentor'}">${esc(p.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
      <div><h1>Hi ${esc(p.name.split(' ')[0])}</h1>
        <div class="sub">${mentee?'Mentee':'Mentor'} · ${esc(GRMP.TRACKS[p.track].label)} track · ${esc(db.config.cohort.label)}
        ${p.previewFastForward?' · <b style="color:var(--ai-ink)">demo fast-forwarded to March</b>':''}</div></div>
    </div>
    <div style="font-size:11.5px;color:var(--ink-3);margin:-8px 0 14px">🔗 You opened this from your personal link — no account, no password. That's by design.</div>
    <div class="steps">${steps.map((s,i)=>`<div class="step ${s[1]?'done':(i===curIdx?'cur':'')}"><div class="dot">${s[1]?'✓':i+1}</div><span>${s[0]}</span></div>`).join('')}</div>
    ${nextCard}${certCard}${brCard}${mrCard}${pairCards}
    ${inferred('Q2')}
  </div>`;
},
};

</script>
<script>
/* GRMP Demo — admin console views (manual ch.4–8). Sign-in simulated; role-scoped. */

const Console = {

/* ---------- 4.0 login ---------- */
login(){
  const db = __demo.db;
  return `<div class="login-wrap"><div class="login-card">
    <h1>GRMP Console</h1>
    <div class="sub">Programme team sign-in · GRMP 2026 (SMU pilot)</div>
    ${db.config.admins.map(a=>`
      <button class="login-row" data-goto="#/console/${encodeURIComponent(a.name)}">
        <div class="avatar av-mentor" style="width:36px;height:36px;font-size:12px;border-radius:10px">${a.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
        <div style="flex:1"><b>${a.name}</b><div class="r">${a.role}</div></div>
        <span style="color:var(--ink-3)">→</span>
      </button>`).join('')}
    <div class="sim-note">🔐 In production this is Google sign-in. The demo simulates it — click a person to enter with their permissions.</div>
  </div></div>`;
},

/* ---------- console shell + routing ---------- */
shell(name, view){
  const db = __demo.db;
  const admin = db.config.admins.find(a=>a.name===name);
  if(!admin) return this.login();
  const R = admin.roles;
  const items = [];
  if(R.includes('coordinator')||R.includes('lead')||R.includes('dashboard_viewer')) items.push(['dashboard','📊 Dashboard']);
  if(R.includes('mentor_reviewer')) items.push(['review-mentors','🎓 Review mentors', db.people.filter(p=>p.kind==='mentor'&&p.appStatus==='submitted').length]);
  if(R.includes('mentee_reviewer')) items.push(['review-mentees','👤 Review mentees', db.people.filter(p=>p.kind==='mentee'&&p.appStatus==='submitted').length]);
  if(R.includes('lead')) items.push(['decisions','⚖ Decisions', db.people.filter(p=>p.appStatus==='submitted'&&db.reviews.some(v=>v.personId===p.id)).length]);
  if(R.includes('lead')||R.includes('coordinator')) items.push(['matching','🤝 Matching', db.pairs.filter(p=>p.status==='proposed').length]);
  if(R.includes('lead')||R.includes('coordinator')) items.push(['submissions','📝 Submissions', db.midreviews.length+db.builderReflections.length]);
  if(R.includes('coordinator')) items.push(['reminders','⏰ Reminders']);
  if(R.includes('coordinator')) items.push(['waitlist','📋 Waitlist', db.people.filter(p=>p.appStatus==='waitlisted').length]);
  const pastR = db.config.rotations.filter(r=>db.today>r.end).map(r=>r.n);
  if(R.includes('coordinator')) items.push(['exceptions','⚠ Exceptions', db.pairs.filter(p=>['rematch_needed'].includes(p.status)).length + db.pairs.filter(p=>pastR.includes(p.rotation)&&p.status==='approved').length]);
  if(R.includes('coordinator')) items.push(['events','🎪 Events']);
  if(R.includes('lead')) items.push(['certificates','🏅 Certificates']);
  if(R.includes('escalation')) items.push(['concerns','🔒 Concern inbox', db.concerns.length]);
  items.push(['emails','✉ Email log', db.emails.length]);
  items.push(['config','⚙ Configuration']);
  const cur = view || items[0][0];
  const body = this['v_'+cur.replace(/-/g,'_')] ? this['v_'+cur.replace(/-/g,'_')](admin) :
    `<p>View not available for your role.</p>`;
  return `<div class="co-shell">
    <aside class="co-side">
      <div class="co-brand">GRMP Console<small>${db.config.cohort.label.toUpperCase()}</small></div>
      <nav class="co-nav">
        <div class="lab">${admin.role}</div>
        ${items.map(([k,label,n])=>`<button class="co-item ${k===cur?'on':''}" data-goto="#/console/${encodeURIComponent(name)}/${k}">${label}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}
      </nav>
      <div class="co-user"><b>${admin.name}</b>${admin.role}<br>
        ${(typeof REMOTE!=='undefined'&&REMOTE)?'<button data-act="logout" style="background:none;border:0;color:#8b93a1;font-size:11px;padding:0;cursor:pointer">Sign out</button>':'<a href="#/console" style="color:#8b93a1;font-size:11px">Switch user</a>'}</div>
    </aside>
    <main class="co-main">${body}</main>
  </div>`;
},

/* ---------- 6.1 dashboard ---------- */
v_dashboard(admin){
  const db = __demo.db, D = GRMP.D;
  const acc = db.people.filter(p=>['accepted','reserve_bench'].includes(p.appStatus));
  const ackDone = acc.filter(D.ackComplete).length;
  const orient = acc.filter(p=>p.orientation).length;
  const r1closed = db.pairs.filter(p=>p.rotation===1&&p.status==='closed').length;
  const curN = D.currentRotation(db)?D.currentRotation(db).n:3;
  const r2 = db.pairs.filter(p=>p.rotation===curN&&['approved','closed'].includes(p.status)).length;
  const blocked = db.people.filter(p=>p.appStatus==='accepted'&&D.gateBlocked(p));
  const pastRd = db.config.rotations.filter(r=>db.today>r.end).map(r=>r.n);
  const exceptions = db.pairs.filter(p=>p.status==='rematch_needed').length + db.pairs.filter(p=>pastRd.includes(p.rotation)&&p.status==='approved').length;
  const track = t => db.people.filter(p=>p.kind==='mentee'&&p.appStatus==='accepted'&&p.track===t).length;
  return `<h1 class="co-title">Dashboard</h1>
  <p class="co-sub">Single source of truth · simulated today: ${db.today}${D.currentRotation(db)?` · Rotation ${D.currentRotation(db).n} (${D.currentRotation(db).label}) is running`:' · closing phase'}.</p>
  <div class="funnel-grid">
    <div class="stat"><div class="n">${db.people.filter(p=>p.kind==='mentee').length} / ${db.people.filter(p=>p.kind==='mentor').length}</div><div class="l">Mentee / mentor applications</div></div>
    <div class="stat"><div class="n">60 + 60</div><div class="l">Accepted (incl. 6 bench mentors)</div></div>
    <div class="stat"><div class="n">${ackDone}<span style="font-size:13px;color:var(--ink-3)">/${acc.length}</span></div><div class="l">Acknowledged (binding gate)</div></div>
    <div class="stat"><div class="n">${orient}<span style="font-size:13px;color:var(--ink-3)">/${acc.length}</span></div><div class="l">Orientation complete</div></div>
    <div class="stat"><div class="n">${r1closed}/60</div><div class="l">R1 closed off</div></div>
    <div class="stat"><div class="n">${r2}</div><div class="l">R${D.currentRotation(db)?D.currentRotation(db).n:3} pairs</div></div>
    <div class="stat"><div class="n" style="color:${exceptions?'var(--warn)':'var(--ok)'}">${exceptions}</div><div class="l">Open exceptions</div></div>
    <div class="stat"><div class="n">${track('general')}·${track('entrepreneurship')}·${track('ai')}</div><div class="l">Mentees by track (G·E·AI)</div></div>
    <div class="stat"><div class="n">${db.midreviews.length}</div><div class="l">Mid-programme reviews in</div></div>
    <div class="stat"><div class="n">${db.builderReflections.length}</div><div class="l">Builder Reflections in</div></div>
    <div class="stat"><div class="n">${db.certificates.length}</div><div class="l">Certificates issued</div></div>
    <div class="stat"><div class="n">${db.events.kickoff.attendance.length}</div><div class="l">Kickoff attendance</div></div>
  </div>
  ${admin.roles.includes('lead')?`<div style="margin:-6px 0 14px"><button class="btn sm btn-ghost" data-act="exportReport">⬇ Export cohort report (CSV)</button>
    <span style="font-size:11px;color:var(--ink-3);margin-left:8px">export restricted to Programme Lead + System Administrator</span></div>`:''}
  ${blocked.length?`<div class="qcard"><b style="font-size:13.5px">⛔ Blocked at the gates (${blocked.length})</b>
    <p style="font-size:12.5px;color:var(--ink-2);margin:6px 0 8px">Accepted but not yet matchable — acknowledgement or orientation outstanding. The system will not let these into matching.</p>
    ${blocked.map(p=>`<div style="display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2);font-size:13px">
      <b>${p.name}</b><span class="track-chip track-${p.track}">${GRMP.TRACKS[p.track].label}</span>
      <span style="color:var(--ink-3);font-size:12px">${D.ackComplete(p)?'✓ acknowledged':'✗ acknowledgement'} · ${p.orientation?'✓ orientation':'✗ orientation'}</span>
      <a style="margin-left:auto;font-size:12px" href="#/me/${p.id}">open their page →</a></div>`).join('')}</div>`:''}
